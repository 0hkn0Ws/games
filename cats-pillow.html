<!DOCTYPE html>

<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;}
html,body{margin:0;height:100%;overflow:hidden;background:#1a1420;
  font-family:"Segoe UI",system-ui,-apple-system,"Trebuchet MS",sans-serif;color:#fff;}
#app{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;}
#stage{position:relative;overflow:hidden;border-radius:14px;
  box-shadow:0 18px 60px rgba(0,0,0,.6);}
canvas{display:block;width:100%;height:100%;}
#ui{position:absolute;left:0;top:0;width:960px;height:540px;transform-origin:0 0;pointer-events:none;}
#ui.active{pointer-events:auto;}

/* ---------- меню ---------- */
.modal{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(ellipse at center,rgba(30,20,40,.72),rgba(8,5,14,.92));}
.panel{position:relative;width:min(700px,90%);max-height:508px;overflow-y:auto;
  background:linear-gradient(180deg,#3a2f4e,#241d34);
  border-radius:26px;padding:22px 30px 22px;text-align:center;
  box-shadow:0 22px 50px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.16);}
.panel::-webkit-scrollbar{width:8px;}
.panel::-webkit-scrollbar-thumb{background:#6a5a86;border-radius:4px;}
.title{font-size:44px;font-weight:800;letter-spacing:.5px;margin:0 0 6px;
  background:linear-gradient(180deg,#ffe9a8,#ffb454);-webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent;text-shadow:0 3px 0 rgba(0,0,0,.18);}
.sub{font-size:16px;color:#cbbfe6;line-height:1.55;margin:8px 0 18px;}
h2{font-size:26px;margin:0 0 10px;color:#ffd98a;font-weight:800;}
h3{font-size:14px;margin:14px 0 8px;color:#8fdcff;letter-spacing:2px;font-weight:700;text-transform:uppercase;}
p{font-size:14px;line-height:1.55;color:#d6cbe9;margin:7px 0;}

.btn{font-family:inherit;font-size:16px;font-weight:700;padding:11px 24px;margin:5px;
  border:none;border-radius:14px;cursor:pointer;color:#3a2a12;
  background:linear-gradient(180deg,#ffe08a,#f5b53f);
  box-shadow:0 5px 0 #b57d20,0 8px 18px rgba(0,0,0,.3);
  transition:transform .08s,box-shadow .08s;}
.btn:hover{filter:brightness(1.06);}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #b57d20;}
.btn.alt{color:#0d2b38;background:linear-gradient(180deg,#a8e6ff,#5cc3e8);box-shadow:0 5px 0 #2f7d96,0 8px 18px rgba(0,0,0,.3);}
.btn.alt:active{box-shadow:0 1px 0 #2f7d96;}
.btn.dim{color:#e6dcf5;background:linear-gradient(180deg,#7d6f9c,#5a4d78);box-shadow:0 5px 0 #3a3054;}
.btn.dim:active{box-shadow:0 1px 0 #3a3054;}
.btn.small{font-size:13px;padding:8px 16px;border-radius:11px;}

.keys{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:14px 0;}
.key{background:rgba(255,255,255,.08);border-radius:12px;padding:8px 12px;font-size:13px;color:#e4daf4;
  display:flex;align-items:center;gap:8px;}
.key b{background:#f5f0ff;color:#2b2140;border-radius:7px;padding:2px 9px;font-size:12px;font-weight:800;
  box-shadow:0 2px 0 #b9aed0;}

.cards{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin:12px 0 4px;}
.card{width:168px;background:linear-gradient(180deg,#463a5e,#2c2440);border-radius:18px;padding:13px 12px;
  cursor:pointer;border:2px solid rgba(255,255,255,.08);transition:transform .1s,border-color .1s;
  box-shadow:0 8px 20px rgba(0,0,0,.3);}
.card:hover{transform:translateY(-4px);border-color:#ffd98a;}
.card .ic{font-size:30px;line-height:1;margin-bottom:6px;}
.card b{display:block;font-size:14px;color:#ffd98a;margin-bottom:5px;}
.card i{font-style:normal;font-size:12px;color:#bdb0d6;line-height:1.35;display:block;}

/* ---------- тач ---------- */
.tbtn{position:absolute;pointer-events:auto;border:none;border-radius:50%;
  background:rgba(255,255,255,.16);color:#fff;font-size:22px;font-weight:800;
  display:flex;align-items:center;justify-content:center;

.tbtn:active{background:rgba(255,217,138,.55);}

.toast{position:absolute;left:480px;top:150px;transform:translate(-50%,-50%);

.toast.show{opacity:1;}

/* ============================================================
   БОЙ НА ПОДУШКАХ — 2D файтинг вид сбоку, плавная графика

   ============================================================ */

var W=960, H=540;
var FLOOR=470;              // линия пола (ноги котов)
var WALL_L=52, WALL_R=908;

var ui=document.getElementById('ui');

/* ---------- утилиты ---------- */
function clamp(v,a,b){ return v<a?a:(v>b?b:v); }
function rnd(a,b){ return a+Math.random()*(b-a); }
function irnd(a,b){ return Math.floor(rnd(a,b+1)); }
function pick(a){ return a[Math.floor(Math.random()*a.length)]; }
function lerp(a,b,t){ return a+(b-a)*t; }
function ease(t){ return t<0.5?2*t*t:1-Math.pow(-2*t+2,2)/2; }
function rr(x,y,w,h,r){
  r=Math.min(r,Math.abs(w)/2,Math.abs(h)/2);
  ctx.beginPath();
  if(ctx.roundRect){ ctx.roundRect(x,y,w,h,r); return; }
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath();
}

/* ---------- звук ---------- */
var AC=null, noiseBuf=null;
function actx(){
  if(!AC){ try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ AC=false; } }
  if(AC && !noiseBuf){
    try{
      noiseBuf=AC.createBuffer(1, AC.sampleRate*0.5, AC.sampleRate);
      var d=noiseBuf.getChannelData(0);
      for(var i=0;i<d.length;i++) d[i]=Math.random()*2-1;
    }catch(e){}
  }
  return AC;
}
function tone(f,dur,type,vol,slide,delay){
  if(G.muted) return;
  var a=actx(); if(!a) return;
  var t0=a.currentTime+(delay||0);
  try{
    var o=a.createOscillator(), g=a.createGain();
    o.type=type||'sine'; o.frequency.setValueAtTime(f,t0);
    if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),t0+dur);
    g.gain.setValueAtTime(0.0001,t0);
    g.gain.exponentialRampToValueAtTime(vol||0.06,t0+0.012);
    g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
    o.connect(g); g.connect(a.destination); o.start(t0); o.stop(t0+dur+0.05);
  }catch(e){}
}
function noise(dur,vol,freq,q,delay){
  if(G.muted) return;
  var a=actx(); if(!a||!noiseBuf) return;
  var t0=a.currentTime+(delay||0);
  try{
    var s=a.createBufferSource(); s.buffer=noiseBuf;
    var f=a.createBiquadFilter(); f.type='bandpass'; f.frequency.value=freq||900; f.Q.value=q||1.1;
    var g=a.createGain();
    g.gain.setValueAtTime(0.0001,t0);
    g.gain.exponentialRampToValueAtTime(vol||0.08,t0+0.01);
    g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
    s.connect(f); f.connect(g); g.connect(a.destination); s.start(t0); s.stop(t0+dur+0.05);
  }catch(e){}
}

    tone(base*1.5,0.16,'sine',0.06,0,0.07);
    if(n>=12){ tone(base*2,0.22,'triangle',0.05,0,0.14); }
  }
};

/* ============================================================
   КОТ
   ============================================================ */
function makeCat(o){
  return {
    x:o.x, y:FLOOR, vx:0, vy:0, facing:o.facing||1, onGround:true, airJumps:1,
    hp:100, maxHp:100, rage:0, maxRage:RAGE_MAX,
    state:'idle', act:null, atkCd:0, hitStun:0,
    hurtFlash:0, anim:0, walk:0, blinkT:rnd(1,4), blinking:0,
    koT:0, isPlayer:!!o.isPlayer, name:o.name,
    fur:o.fur, fur2:o.fur2, belly:o.belly, ear:o.ear, eye:o.eye, scale:o.scale||1,
    combo:0, comboT:0, comboStep:0, regenT:0, superFlash:0, rageGlow:0,
    trail:[], burnT:0, burnTick:0, slowT:0, stunMul:1, hitChain:0, hitChainT:0,
    ghost:0, blinkT2:2.5, blinkIn:0, shield:0, trait:o.trait||'balanced',
    juggleT:0, spikeT:0, landShake:0, frozenT:0
  };
}
function catMul(c){
  if(c.isPlayer) return G.mods;
  var o=OPPONENTS[G.fight];
  return { dmg:o.dmg||1, speed:o.speed, jump:1, rageGain:o.rage };
}
/* подушка игрока */
function pillow(){ for(var i=0;i<PILLOWS.length;i++) if(PILLOWS[i].id===G.pillow) return PILLOWS[i]; return PILLOWS[0]; }

/* ---------- настройки игрока (бонусы) ---------- */
function resetMods(){
  G.mods={ dmg:1, speed:1, maxHp:0, jump:1, regen:0, rageGain:1, superMul:1, comboSpd:1,
           reach:1, vamp:0, shield:0, luck:0 };
}

/* ============================================================
   ПЕРСОНАЖИ
   ============================================================ */
function newGame(){
  resetMods();
  G.bonusApplied=[];
  G.stats={hits:0,blocked:0,maxCombo:0};
  G.fight=0; G.wins=0; G.lives=LIVES;
  G.pillow='classic';
  G.unlocked=['classic','feather','heavy'];
  G.healCarry=0;
  G.scene='fight';
  startFight();
}
function startFight(){
  var o=OPPONENTS[G.fight];
  var m=G.mods, pl=pillow();
  G.arena=ARENAS[o.arena!==undefined?o.arena:(G.fight%ARENAS.length)];
  G.player=makeCat({x:330, facing:1, isPlayer:true, name:'Мурзик',
    fur:'#f0a44f', fur2:'#d9822f', belly:'#ffe3bd', ear:'#ffb8c8', eye:'#4ec46a', scale:1});
  G.player.maxHp=100+m.maxHp; G.player.hp=G.player.maxHp;
  G.player.shield=m.shield||0;
  // между боями Мурзик немного подлечивается
  if(G.healCarry>0){ G.player.hp=Math.min(G.player.maxHp, G.player.hp+G.healCarry); }
  G.healCarry=0;

  G.enemy=makeCat({x:630, facing:-1, isPlayer:false, name:o.name,
    fur:o.fur, fur2:o.fur2, belly:o.belly, ear:o.ear, eye:o.eye, scale:o.scale, trait:o.trait});
  G.enemy.maxHp=o.hp; G.enemy.hp=o.hp;

  G.ai={ react:o.react, aggro:o.aggro, jump:o.jump, heavyBias:o.heavy,
         thinkT:0, act:'approach', actT:0, snap:null, snapT:o.react, trait:o.trait,
         blinkCd:rnd(1.2,2.2), chargeCd:rnd(2,4) };
  G.pillowFx={};

  G.feathers=[]; G.puffs=[]; G.floats=[];
  G.timeLeft=G.timer;
  G.countdown=3.2;
  G.roundState='countdown';
  G.winner=null;
  G.slowT=0; G.shieldUsed=false; G.vampCount=0;
  G.shake=0; G.hitstop=0; G.punch=0; G.slowmo=0;
  closeModal();
  ui.classList.remove('active');
}

/* ============================================================
   АТАКИ
   ============================================================ */
function attackSpec(c, kind){
  var m=catMul(c), spd=(c.isPlayer?G.mods.comboSpd:1);
  var base, pl=(c.isPlayer?pillow():null);
  var key=kind;
  if(key==='air') key = (c.vy<60 ? 'airup' : 'air');    // вверх — жонглирование, вниз — обрушение
  if(key==='airup') base=AIR_UP;
  else if(key==='air') base=AIR_ATK;
  else if(key==='lunge') base=LUNGE;
  else if(key==='swipe') base=SWIPE;
  else base=COMBO[clamp(c.comboStep,0,COMBO.length-1)];
  var dmgMul = m.dmg * (pl? pl.dmg:1);
  var spdMul = (pl? pl.spd:1);
  var kbMul  = (pl? pl.kb:1);
  var reachMul = (c.isPlayer? G.mods.reach:1);
  return {
    kind:kind, finisher:!!base.finisher, dive:!!base.dive, launch:!!base.launch,
    spike:!!base.spike, juggle:!!base.juggle, lunge:!!base.lunge, back:!!base.back,
    dmg: base.dmg*dmgMul,
    kb: base.kb*kbMul, stun: base.stun, reach: base.reach*reachMul, arc: base.arc,
    windup: base.windup/(spd*spdMul), active: base.active/(spd*spdMul), recover: base.recover/(spd*spdMul),
    fx: pl? pl.fx:null
  };
}
function canAttack(c){
  if(c.state==='ko'||c.hitStun>0) return false;
  if(c.act) return false;
  return true;
}
/* выбор удара по контексту: земля/воздух + нажатые направления */
function chooseAttack(c){
  var foe=c.isPlayer?G.enemy:G.player;
  if(!c.onGround) return 'air';
  var ax=0;
  if(c.isPlayer){
    if(keys['a']||keys['arrowleft']) ax-=1;
    if(keys['d']||keys['arrowright']) ax+=1;
  }
  var away = foe ? ((foe.x>c.x?-1:1)) : 0;    // -1 если враг справа
  var towards = foe ? ((foe.x>c.x?1:-1)) : 0;
  if(ax!==0){
    if(ax===towards) return 'lunge';          // удар в сторону врага — выпад
    if(ax===away)    return 'swipe';          // удар от врага — отступление
  }
  return 'combo';
}
function startAttack(c, kind){
  if(!canAttack(c)) return false;
  if(!kind) kind = chooseAttack(c);
  var spec=attackSpec(c, kind);
  if(spec.dive||spec.juggle){ spec.windup*=0.6; spec.recover*=0.6; }
  c.act={kind:kind, t:0, spec:spec, hitDone:false};
  c.atkCd = spec.windup+spec.active+spec.recover;
  // рывок вперёд/назад во время удара
  if(spec.lunge) c.vx = c.facing*460;
  if(spec.back)  c.vx = -c.facing*260;
  if(kind==='combo'){
    c.comboStep = c.comboStep>=(COMBO.length-1) ? 0 : c.comboStep+1;
    c.comboStepT = COMBO_WINDOW;
  }
  SFX.swing();
  return true;
}
function tryHit(a,d,act){
  if(!d||d.hp<=0||act.hitDone) return;
  if(d.invulnGhost>0) return;                 // неуязвим в момент телепорта
  var s=act.spec;
  var dx=(d.x-a.x)*a.facing;
  var dy=Math.abs((d.y-58)-(a.y-58));
  if(dx<-16||dx>s.reach) return;
  if(dy>110) return;
  act.hitDone=true;
  var beforeHp=d.hp;
  dealDamage(a,d,s.dmg,s.kb,s.stun,false,s.fx);
  // особые свойства ударов
  if(d.hp<beforeHp){
    if(s.launch){                      // третий удар подбрасывает
      d.vy=-520; d.onGround=false;
      d.juggleT=1.1;                   // окно для жонглирования в воздухе
      addFloat(d.x,d.y-160,'ВВЕРХ!','#ffe08a',20);
    }
    if(s.spike && !d.onGround){        // обрушение сверху — вбивает в пол
      d.vy=Math.max(d.vy, 620);
      d.spikeT=1;
      addFloat(d.x,d.y-160,'ОБРУШЕНИЕ!','#ffb066',20);
    }
    if(s.juggle){                      // удар вверх держит врага в воздухе
      if(!d.onGround){ d.vy=-300; }
      d.juggleT=Math.max(d.juggleT||0,0.9);
    }
  }
  if(s.finisher){
    // мощная добивающая — больше пуха и тряски
    spawnFeathers(d.x,d.y-80,10);
    G.shake=Math.max(G.shake,15);
    G.hitstop=Math.max(G.hitstop,0.07);
  }
}
function dealDamage(a,d,dmg,kb,stun,wasBlocked,fx){
  dmg=Math.max(1,Math.round(dmg));
  // уменьшение стана при затяжной серии — жертва может вырваться
  d.hitChain=(d.hitChain||0)+1;
  d.hitChainT=1.1;
  var scale = 1/(1+(d.hitChain-1)*0.42);
  stun = stun*clamp(scale,0.32,1) * (d.stunMul||1);
  // пуховый щит игрока поглощает один удар
  if(d.isPlayer && d.shield>0 && !wasBlocked){
    d.shield--; G.shieldUsed=true;
    spawnPuff(d.x,d.y-70,2.0,'#cfe8ff');
    addFloat(d.x,d.y-130,'ЩИТ!','#8fdcff',22);
    SFX.block();
    d.vx = kb*a.facing*0.25;
    d.hitStun=Math.max(d.hitStun,0.15);
    a.combo++; a.comboT=1.3;
    return;
  }
  d.hp-=dmg;
  d.hurtFlash=0.28;
  d.hitStun=Math.max(d.hitStun,stun);
  // жонглирование: подброшенного врага не отбрасывает далеко
  if(d.juggleT>0 && !d.onGround) d.vx = kb*a.facing*0.22;
  else if(d.spikeT>0) d.vx = kb*a.facing*0.5;
  else d.vx = kb*a.facing*(d.hitChain>3?0.55:1);
  if(kb>420 && d.hitChain<4 && d.juggleT<=0){ d.vy=-260; d.onGround=false; }
  a.combo++; a.comboT=1.3;
  if(a.isPlayer){ G.stats.hits++; G.stats.maxCombo=Math.max(G.stats.maxCombo,a.combo); }
  // крупный хит — больше эффектов
  var big = kb>420 || !!fx;
  spawnFeathers(d.x, d.y-78, kb>420?22:12);
  spawnPuff(d.x, d.y-78, kb>420?1.5:1.0, '#ffffff');
  G.shake=Math.max(G.shake, kb>420?13:7);
  G.hitstop=Math.max(G.hitstop, kb>420?0.07:0.04);
  SFX.hit(); if(kb>420) SFX.heavy();
  G.punch=Math.max(G.punch, kb>420?0.6:0.28);
  addFloat(d.x+rnd(-12,12), d.y-118, '-'+dmg, a.isPlayer?'#ffe08a':'#ff9a9a', kb>420?26:20);
  addHitMark(d.x, d.y-78, kb>420?1.5:1, fx);
  // ранг серии — только для игрока
  if(a.isPlayer){
    for(var ri=COMBO_RANKS.length-1;ri>=0;ri--){
      if(a.combo===COMBO_RANKS[ri].n){
        var rk=COMBO_RANKS[ri];
        addFloat(480, 200, rk.t, rk.c, 34);
        SFX.combo(rk.n);
        G.comboFlash=0.5;
        G.comboFlashCol=rk.c;
        break;
      }
    }
  }
  // эффекты подушки
  if(a.isPlayer && fx) applyPillowFx(d,fx);
  // вампиризм
  if(a.isPlayer && G.mods.vamp>0){
    G.vampCount++;
    if(G.vampCount>=3){
      G.vampCount=0;
      a.hp=Math.min(a.maxHp,a.hp+3);
      addFloat(a.x,a.y-150,'+3','#5fdc6a');
      spawnPuff(a.x,a.y-70,0.9,'#ffb3c8');
    }
  }
  // ярость
  var rageMul=(a.isPlayer?(G.mods.rageGain*(pillow().rage)*(1+(G.mods.luck||0))):1);
  if(a.isPlayer) gainRage(RAGE_DEAL*rageMul);
  else if(d.isPlayer) gainRage(RAGE_TAKE);
  if(!a.isPlayer) a.rage=clamp((a.rage||0)+RAGE_DEAL, 0, RAGE_MAX);
  if(d.isPlayer) SFX.hurt();
  else SFX.meow();
  if(d.hp<=0){ d.hp=0; koCat(d,a); }
}
/* эффекты разных подушек */
function applyPillowFx(d,fx){
  if(fx==='burn'){
    d.burnT=3.0; d.burnTick=0;
    addFloat(d.x,d.y-150,'ГОРИТ!','#ff9a4d',18);
  } else if(fx==='slow'){
    d.slowT=2.2;
    addFloat(d.x,d.y-150,'ЗАМОРОЖЕН','#8fdcff',18);
  } else if(fx==='stun'){
    d.stunMul=1.9;
    d.hitStun+=0.22;
    addFloat(d.x,d.y-150,'ТОК!','#ffe066',18);
  } else if(fx==='heavy'){
    G.shake=Math.max(G.shake,17);
    spawnPuff(d.x,d.y-70,1.8,'#e0dce8');
  }
}
/* отметки попаданий — яркие вспышки в месте удара */
function addHitMark(x,y,scale,fx){
  G.hitMarks.push({x:x,y:y,scale:scale,col:
    fx==='burn'?'#ffb066': fx==='slow'?'#bfe9ff': fx==='stun'?'#fff6a8':
    fx==='rainbow'?'#ffb3e6':'#ffffff', life:0.22, max:0.22, rot:rnd(0,6.28)});
}
function gainRage(n){
  var p=G.player; if(!p) return;
  var was=p.rage;
  p.rage=clamp(p.rage+n,0,RAGE_MAX);
  if(was<RAGE_MAX && p.rage>=RAGE_MAX){ SFX.ready(); addFloat(p.x,p.y-160,'ЯРОСТЬ ГОТОВА!','#ffd166',22); }
}
/* сверхудар — когда шкала ярости заполнена. У КАЖДОЙ ПОДУШКИ СВОЯ АТАКА */
var SUPER_DEFS={
  whirl:  {label:'ВИХРЬ ПУХА',    dmg:40, col:'#fdf6ff'},
  flurry: {label:'ШКВАЛ ПУХА',    dmg:46, col:'#ffffff'},
  quake:  {label:'ЗЕМЛЕТРЯСЕНИЕ', dmg:54, col:'#c4becf'},
  chain:  {label:'ЦЕПНАЯ МОЛНИЯ', dmg:44, col:'#fff6a8'},
  inferno:{label:'ОГНЕННЫЙ ВАЛ',  dmg:48, col:'#ffb066'},
  glacier:{label:'ЛЕДЯНАЯ ГЛЫБА', dmg:42, col:'#bfe9ff'},
  prism:  {label:'РАДУЖНЫЙ ЛУЧ',  dmg:52, col:'#ffb3e6'}
};
function superLabel(){ var pl=pillow(); return (SUPER_DEFS[pl.super]||SUPER_DEFS.whirl).label; }

function useSuper(){
  var p=G.player, e=G.enemy;
  if(G.roundState!=='fight'||p.state==='ko'||p.act) return;
  if(p.rage<RAGE_MAX) return;
  var pl=pillow(), def=SUPER_DEFS[pl.super]||SUPER_DEFS.whirl;
  var baseMul=G.mods.dmg*G.mods.superMul*(1+(G.mods.luck||0));
  var dmgMul=baseMul*pl.dmg;

  p.superFlash=0.5; p.act=null; p.hitStun=0; p.invuln=Math.max(p.invuln,0.5);
  p.rage=0;
  G.hitstop=0.16; G.shake=Math.max(G.shake,26); G.punch=1.1;
  G.comboFlash=0.6; G.comboFlashCol=def.col;
  addFloat(480,168,def.label+'!',def.col,42);
  SFX.super();
  spawnFeathers(p.x,p.y-60,40);

  var foeHit=false;
  function hitEnemy(dmg,kb,stun,fx,extra){
    if(!e||e.state==='ko'||foeHit) return;
    // сначала урон (он накладывает эффект подушки), ПОТОМ усиливаем эффект супера
    e.hitStun=0; e.act=null;
    dealDamage(p,e,Math.round(dmg),kb,stun,false,fx);
    foeHit=true;
    if(extra) extra();                       // поверх эффекта подушки — уникальный эффект супера
    spawnFeathers(e.x,e.y-78,26); spawnPuff(e.x,e.y-78,2.4,'#ffffff');
  }
  var R=SUPER.radius, dd=e?Math.abs(e.x-p.x):999;

  if(pl.super==='whirl'){
    // круговой удар по всему вокруг
    G.shockwaves.push({x:p.x,y:p.y-20,r:24,max:R+70,life:0.55,maxLife:0.55,col:pl.col2});
    G.shockwaves.push({x:p.x,y:p.y-90,r:14,max:R*0.8,life:0.5,maxLife:0.5,col:pl.col});
    spawnPuff(p.x,p.y-60,3.4,'#fff6d8');
    if(dd<R) hitEnemy(def.dmg*dmgMul, 780, 0.9, 'stun');
  }
  else if(pl.super==='flurry'){
    // три мгновенных удара на всю ширину
    G.shockwaves.push({x:p.x,y:p.y-70,r:10,max:W,life:0.4,maxLife:0.4,col:'#ffffff'});
    for(var i=0;i<3;i++){
      (function(k){
        setTimeout(function(){
          if(!G.player||G.roundState!=='fight') return;
          addFloat(p.x+p.facing*(60+k*40), p.y-70, '×', '#ffffff', 30);
          addHitMark(p.x+p.facing*(70+k*40), p.y-70, 1.6, 'fast');
          SFX.hit();
        }, k*70);
      })(i);
    }
    if(dd<520) hitEnemy(def.dmg*dmgMul, 520, 0.85, 'fast');
  }
  else if(pl.super==='quake'){
    // прыжок и удар по полу
    p.vy=-620; p.onGround=false;
    G.quakeT=0.42;
    if(dd<R+40) hitEnemy(def.dmg*dmgMul, 400, 0.9, 'heavy', function(){
      e.vy=-720; e.onGround=false; e.juggleT=1.4;      // подбрасывает
      addFloat(e.x,e.y-170,'ПОДБРОШЕН!','#c4becf',24);
    });
  }
  else if(pl.super==='chain'){
    // молния бьёт врага и надолго оглушает
    G.beams.push({kind:'chain', x1:p.x, y1:p.y-70, x2:e?e.x:p.x+p.facing*200, y2:e?e.y-70:p.y-70,
      col:'#fff6a8', life:0.45, maxLife:0.45, seed:rnd(0,99)});
    if(dd<560) hitEnemy(def.dmg*dmgMul, 300, 1.6, 'stun', function(){
      e.stunMul=2.4; e.slowT=Math.max(e.slowT,1.2);
    });
  }
  else if(pl.super==='inferno'){
    // волна пламени: поджигает надолго
    G.beams.push({kind:'fire', x1:p.x, y1:p.y-40, x2:p.x+p.facing*(R+120), y2:p.y-40,
      col:'#ffb066', life:0.6, maxLife:0.6, seed:rnd(0,99)});
    for(var f=0;f<26;f++) spawnPuff(p.x+p.facing*rnd(0,R+100), p.y-rnd(10,110), rnd(0.8,1.8), '#ffb066');
    if(dd<R+110) hitEnemy(def.dmg*dmgMul, 480, 0.8, 'burn', function(){
      e.burnT=Math.max(e.burnT,6);
    });
  }
  else if(pl.super==='glacier'){
    // ледяная глыба: сковывает надолго
    G.beams.push({kind:'ice', x1:p.x, y1:p.y-40, x2:e?e.x:p.x+p.facing*(R+80), y2:e?e.y-40:p.y-40,
      col:'#bfe9ff', life:0.6, maxLife:0.6, seed:rnd(0,99)});
    for(var g2=0;g2<20;g2++) spawnPuff(p.x+rnd(-60,60), p.y-rnd(0,120), rnd(0.7,1.6), '#bfe9ff');
    if(dd<R+80) hitEnemy(def.dmg*dmgMul, 220, 1.9, 'slow', function(){
      e.slowT=Math.max(e.slowT,6); e.frozenT=1.6;
      addFloat(e.x,e.y-170,'СКОВАН!','#bfe9ff',24);
    });
  }
  else if(pl.super==='prism'){
    // пробивающий луч через всю арену — достаёт всегда
    G.beams.push({kind:'prism', x1:p.x, y1:p.y-70, x2:p.x+p.facing*W*1.2, y2:p.y-70,
      col:'#ffb3e6', life:0.55, maxLife:0.55, seed:rnd(0,99)});
    G.comboFlash=0.6;
    hitEnemy(def.dmg*dmgMul, 900, 1.0, 'rainbow');    // всегда попадает
  }
  G.shake=Math.max(G.shake,pl.super==='quake'?32:26);
}

function koCat(d,a){
  d.state='ko'; d.koT=0; d.vx=340*(a? a.facing : (d.facing*-1)); d.vy=-340; d.onGround=false;
  d.act=null;
  spawnFeathers(d.x,d.y-78,34); spawnPuff(d.x,d.y-78,2.2,'#fff');
  spawnFeathers(d.x,d.y-90,16);
  addDust(d.x,FLOOR,10);
  G.shake=20; G.hitstop=0.12; SFX.ko();
  G.punch=1.0;
  G.slowmo=1.0;                 // короткое замедление — эффект «финального удара»
  G.roundState='ko'; G.koTimer=1.5; G.winner=d.isPlayer?'enemy':'player';
  G.timeLeft=Math.min(G.timeLeft, 99);
}

function spawnPuff(x,y,scale,col){

/* пыль от приземления и шагов */
function addDust(x,y,n){

function addFloat(x,y,text,col,size){

var toastEl=null;
function toast(msg,col){
  if(!toastEl){ toastEl=document.createElement('div'); toastEl.className='toast'; ui.appendChild(toastEl); }
  toastEl.textContent=msg; toastEl.style.color=col||'#fff';

  toastEl._t=setTimeout(function(){ toastEl.classList.remove('show'); },1500);

/* ============================================================
   ОБНОВЛЕНИЕ
   ============================================================ */
function moveCat(c,dt){
  var m=catMul(c);
  var slow=(c.slowT>0?0.45:1);
  if(c.frozenT>0){ slow=0; }                 // полностью скован льдом
  var sp=330*m.speed*slow*(c.state==='block'?0.42:1);
  if(c.isPlayer){
    var ax=0;
    if(keys['a']||keys['arrowleft']) ax-=1;
    if(keys['d']||keys['arrowright']) ax+=1;
    if(ax && !c.act && c.hitStun<=0 && c.state!=='ko'){
      c.vx=ax*sp;
      c.walk+=dt*11;
      if(c.onGround) c.state='walk';
    } else if(c.onGround && !c.act){
      c.vx*=0.72;
      if(Math.abs(c.vx)<20){ c.vx=0; if(c.state!=='block') c.state='idle'; }
    }
  } else {
    // скорость задаётся ИИ через c.vx
    if(Math.abs(c.vx)>4) c.walk+=dt*11;
  }
  // физика
  var wasAir=!c.onGround;
  c.vy+=GRAV*dt;
  // жонглирование: пока враг подброшен, он падает медленнее — можно продолжать серию
  if(c.juggleT>0 && !c.onGround){ c.vy-=GRAV*dt*0.45; }
  c.x+=c.vx*dt;
  c.y+=c.vy*dt;
  if(c.y>=FLOOR){
    // приземление
    if(!c.onGround){
      var hard = c.spikeT>0 || Math.abs(c.vy)>420;
      if(c.state==='ko'){ G.shake=Math.max(G.shake,10); spawnPuff(c.x,FLOOR,1.2,'#e8dcf0'); }
      else if(hard){
        // жёсткое падение — пыль, тряска, короткий стан
        G.shake=Math.max(G.shake, c.spikeT>0?16:8);
        spawnPuff(c.x,FLOOR-4,1.4,'#d8cfc0');
        addDust(c.x,FLOOR, c.spikeT>0?12:6);
        if(c.spikeT>0){ c.hitStun=Math.max(c.hitStun,0.45); SFX.spike(); G.hitstop=Math.max(G.hitstop,0.06); }
      } else {
        addDust(c.x,FLOOR,3);
      }
      c.juggleT=0; c.spikeT=0;
    }
    c.y=FLOOR; c.vy=0;
    if(c.state!=='ko') c.state='idle';
    c.onGround=true;
  } else c.onGround=false;
  c.x=clamp(c.x,WALL_L+28,WALL_R-28);
  // трение по земле, если не управляется
  if(c.onGround && !c.isPlayer && !c.act && c.hitStun<=0 && c.state!=='ko') c.vx*=0.86;
  if(c.hitStun>0){ c.vx*=0.86; }
  // разворот к противнику
  var foe=c.isPlayer?G.enemy:G.player;
  if(foe && !c.act && c.state!=='ko'){
    var f=foe.x>c.x?1:-1;
    if(c.facing!==f) c.facing=f;
  }
}
function updateCat(c,dt){
  var foe=c.isPlayer?G.enemy:G.player;
  if(c.comboT>0){ c.comboT-=dt; if(c.comboT<=0) c.combo=0; }
  if(c.hurtFlash>0) c.hurtFlash-=dt;
  if(c.atkCd>0) c.atkCd-=dt;
  if(c.hitStun>0) c.hitStun-=dt;
  c.blinkT-=dt;
  if(c.blinkT<=0){ c.blinking=0.12; c.blinkT=rnd(1.6,4.4); }
  if(c.blinking>0) c.blinking-=dt;
  c.anim+=dt;

  // всегда разворачиваемся к противнику, кроме момента удара
  if(foe && !c.act && c.state!=='ko' && c.hitStun<=0){
    var f=foe.x>c.x?1:-1;
    if(c.facing!==f) c.facing=f;
  }

  if(c.state==='ko'){
    c.koT+=dt;
    moveCat(c,dt);
    return;
  }

  // серия ударов: окно после удара, чтобы продолжить комбо
  if(c.comboStepT>0){
    c.comboStepT-=dt;
    if(c.comboStepT<=0) c.comboStep=0;
  }
  // регенерация здоровья (бонус)
  if(c.isPlayer && G.mods.regen>0){
    c.regenT-=dt;
    if(c.regenT<=0){ c.regenT=1; c.hp=Math.min(c.maxHp,c.hp+G.mods.regen); }
  }
  if(c.superFlash>0) c.superFlash-=dt;
  if(c.rageGlow>0) c.rageGlow-=dt;
  if(c.hitChainT>0){ c.hitChainT-=dt; if(c.hitChainT<=0) c.hitChain=0; }
  if(c.juggleT>0){ c.juggleT-=dt; if(c.juggleT<=0&&c.onGround) c.juggleT=0; }
  if(c.spikeT>0){ c.spikeT-=dt; if(c.spikeT<=0) c.spikeT=0; }
  // горение (огненная подушка)
  if(c.burnT>0){
    c.burnT-=dt;
    c.burnTick-=dt;
    if(c.burnTick<=0){
      c.burnTick=0.5;
      var bd=Math.max(1,Math.round(3));
      c.hp-=bd;
      addFloat(c.x+rnd(-8,8), c.y-120, '-'+bd, '#ff9a4d', 15);
      spawnPuff(c.x,c.y-60,0.7,'#ffb066');
      if(c.hp<=0){ c.hp=0; koCat(c, c.isPlayer?G.enemy:G.player); return; }
    }
  }
  // заморозка (ледяная подушка)
  if(c.slowT>0){
    c.slowT-=dt;
    if(c.slowT<=0) c.slowT=0;
  }
  if(c.frozenT>0){
    c.frozenT-=dt;
    if(c.frozenT<0) c.frozenT=0;
  }
  // восстановление обычного оглушения
  if(c.stunMul>1 && c.hitStun<=0) c.stunMul=1;
  // след при движении (для «скорости»)
  if(c.isPlayer && Math.abs(c.vx)>200 && c.onGround){
    c.trailT=(c.trailT||0)-dt;
    if(c.trailT<=0){ c.trailT=0.05; c.trail.push({x:c.x,y:c.y,life:0.22,max:0.22}); }
  }
  for(var ti=c.trail.length-1;ti>=0;ti--){ c.trail[ti].life-=dt; if(c.trail[ti].life<=0) c.trail.splice(ti,1); }

  // атака
  if(c.act){
    var a=c.act, s=a.spec;
    a.t+=dt;
    var tot=s.windup+s.active+s.recover;
    if(!a.hitDone && a.t>=s.windup && a.t<=s.windup+s.active) tryHit(c,foe,a);
    if(a.t>=tot) c.act=null;
  }

  moveCat(c,dt);

  // расталкивание котов, чтобы не слипались
  if(foe && foe.state!=='ko' && c.state!=='ko'){
    var dx=foe.x-c.x;
    if(Math.abs(dx)<54){
      var push=(54-Math.abs(dx))*0.5*(dx<0?-1:1);
      c.x-=push*0.5; foe.x+=push*0.5;
      c.x=clamp(c.x,WALL_L+28,WALL_R-28);
      foe.x=clamp(foe.x,WALL_L+28,WALL_R-28);
    }
  }
}

/* ============================================================
   ИИ
   ============================================================ */
function updateAI(dt){
  var c=G.enemy, p=G.player, ai=G.ai;
  if(c.state==='ko'||p.state==='ko'){ c.vx*=0.8; return; }
  var m=catMul(c);
  var adist=Math.abs(p.x-c.x);
  var range=COMBO[0].reach-6;
  var trait=ai.trait||'balanced';

  // --- ОСОБЫЕ ЧЕРТЫ ---
  // «Ночная Тень»: телепорт за спину — срабатывает на средней дистанции
  // и как уклонение, когда игрок замахивается
  if(trait==='blink'){
    ai.blinkCd=Math.max(0, ai.blinkCd-dt);
    var pWinding = !!p.act && p.act.t < p.act.spec.windup+0.04;
    var wantBlink = (ai.blinkCd<=0 && (adist>70 || (pWinding && adist<150)));
    if(wantBlink && !c.act && c.hitStun<=0){
      ai.blinkCd=rnd(2.6,4.2);
      spawnPuff(c.x,c.y-60,1.6,'#6a5a9a');
      // появляется за спиной игрока
      c.x=clamp(p.x + (p.facing>0?-72:72), WALL_L+28, WALL_R-28);
      c.facing = c.x>p.x?-1:1;
      c.ghost=0.4; c.invulnGhost=0.25;
      spawnPuff(c.x,c.y-60,1.6,'#3a3550');
      spawnFeathers(c.x,c.y-70,6);
      SFX.blink();
    }
    if(c.ghost>0) c.ghost-=dt;
    if(c.invulnGhost>0) c.invulnGhost-=dt;
  }
  // «Борис»: медленный, но мощный разбег-таран
  if(trait==='tank'){
    ai.chargeCd-=dt;
    if(ai.chargeCd<=0 && adist>170 && adist<420 && c.onGround && !c.act && c.hitStun<=0){
      ai.chargeCd=rnd(3.5,5.5);
      ai.act='charge'; ai.chargeT=0.9;
      spawnPuff(c.x,c.y-40,1.3,'#8a8496');
      SFX.jump();
    }
    if(ai.chargeT>0){
      ai.chargeT-=dt;
      c.vx=(p.x>c.x?1:-1)*520;
      if(c.chargeT<=0) c.vx*=0.3;
      // таран бьёт при касании
      if(adist<52 && c.hitStun<=0 && ai.chargeHit!==true){
        ai.chargeHit=true;
        p.hitStun=0; p.act=null;
        dealDamage(c,p,Math.round(14*m.dmg||14),620,0.6,false);
        G.shake=24;
      }
      if(ai.chargeT<=0) ai.chargeHit=false;
      return;
    }
  }
  // «Сфинкс»: ловко уходит от атак и прыгает
  if(trait==='dodge'){
    var pAtt=!!p.act && p.act.t < p.act.spec.windup+p.act.spec.active+0.06;
    if(pAtt && adist<150 && c.onGround && Math.random()<0.5){
      c.vx=-c.facing*300;
      if(Math.random()<0.5){ c.vy=-700; c.onGround=false; SFX.jump(); }
      ai.act='back';
    }
  }
  // «Васька»: яростный напор
  if(trait==='rush' && !c.act && c.hitStun<=0 && adist>range){
    c.vx=(p.x>c.x?1:-1)*330*m.speed*1.12;
  }

  // сверхудар ИИ, когда ярость полна
  if(c.rage>=RAGE_MAX && adist<SUPER.radius*0.75 && !c.act && c.hitStun<=0){
    c.rage=0; c.superFlash=0.4; G.shake=22; G.hitstop=0.12; SFX.super();
    addFloat(c.x,c.y-160,'СВЕРХПОДУШКА!','#ffb3b3',26);
    spawnPuff(c.x,c.y-60,2.6,'#ffe0e0'); spawnFeathers(c.x,c.y-60,28);
    var dmg=Math.round(SUPER.dmg*0.8);
    p.hitStun=0; p.act=null;
    dealDamage(c,p,dmg,SUPER.kb,SUPER.stun,false);
    spawnFeathers(p.x,p.y-78,22); G.shake=26;
    return;
  }
  // ярость ИИ понемногу растёт со временем
  c.rage=clamp(c.rage + 6*m.rageGain*dt, 0, RAGE_MAX);

  // «зрение» с задержкой реакции
  ai.snapT-=dt;
  if(ai.snapT<=0){
    ai.snapT=ai.react*rnd(0.8,1.25);
    var pAttacking = !!p.act && p.act.t < p.act.spec.windup+p.act.spec.active+0.05;
    ai.snap={ pAttacking:pAttacking, dist:adist, pLow:p.hp<35 };
  }

  // решение раз в thinkT
  ai.thinkT-=dt;
  if(ai.thinkT<=0){
    ai.thinkT=rnd(0.08,0.22)*(1.4-ai.aggro);
    var act='approach';
    if(c.act||c.hitStun>0){ act='wait'; }
    else if(adist>range){ act='approach'; if(Math.random()<0.22) act='dashjump'; }
    else if(adist<52){ act= Math.random()<0.5?'back':'combo'; }
    else {
      var r=Math.random();
      if(r<ai.aggro){ act = Math.random()<ai.heavyBias? 'finisher':'combo'; }
      else act='back';
    }
    if(ai.snap && ai.snap.pLow && Math.random()<0.22) act='approach';
    // если игрок в воздухе — ИИ тоже прыгает
    if(!p.onGround && c.onGround && Math.random()<0.45) act='dashjump';
    ai.act=act; ai.actT=ai.react+0.25;
  }
  ai.actT-=dt;

  var face=p.x>c.x?1:-1;
  c.facing=face;
  if(c.act||c.hitStun>0||c.state==='ko'){ c.vx*=0.9; return; }

  var sp=330*m.speed;
  var a=ai.act;
  if(a==='approach'){ c.vx=face*sp; }
  else if(a==='back'){ c.vx=-face*sp*0.85; }
  else if(a==='dashjump'){
    c.vx=face*sp*1.12;
    if(c.onGround && Math.random()<ai.jump+0.4){ c.vy=-720*m.jump; c.onGround=false; SFX.jump(); }
  }
  else if(a==='combo'||a==='finisher'){
    if(adist<=range+24 && c.atkCd<=0){
      if(a==='finisher') c.comboStep=COMBO.length-1;
      startAttack(c); c.vx*=0.1;
    }
    else if(adist>range){ c.vx=face*sp; }
    else c.vx*=0.7;
  }
  else { c.vx*=0.85; }

  // случайный прыжок при сближении
  if(c.onGround && Math.random()<ai.jump*dt*10 && adist>120){ c.vy=-700*m.jump; c.onGround=false; SFX.jump(); }
}

/* ============================================================
   УПРАВЛЕНИЕ ИГРОКОМ (простое!)
   ============================================================ */
function playerJump(){
  var c=G.player;
  if(G.roundState!=='fight') return;
  if(c.state==='ko'||c.hitStun>0) return;
  if(c.onGround){
    c.vy=-730*G.mods.jump; c.onGround=false; c.airJumps=1; c.state='air';
    addDust(c.x,FLOOR,4);
    SFX.jump();
  } else if(c.airJumps>0){
    c.airJumps--;                       // двойной прыжок
    c.vy=-640*G.mods.jump;
    spawnPuff(c.x,c.y,0.9,'#dff0ff');
    G.speedLinesT=0.2;
    SFX.dbljump();
  }
}
function playerAttack(){
  var c=G.player;
  if(G.roundState!=='fight') return;
  if(c.state==='ko'||c.hitStun>0) return;
  if(c.act) return;                     // идёт удар — не спамим
  startAttack(c);                       // выбор удара: комбо / выпад / отступление / воздух
}

/* ============================================================
   БОЙ (лестница противников)
   ============================================================ */
function updateRound(dt){
  if(G.roundState==='countdown'){
    var prev=Math.ceil(G.countdown);
    G.countdown-=dt;
    var now=Math.ceil(G.countdown);
    if(now!==prev){ if(now>0) SFX.count(); }
    if(G.countdown<=0.2 && G.roundState==='countdown'){ SFX.go(); G.roundState='fight'; addFloat(480,220,'БОЙ!','#ffe08a',54); }
    return;
  }
  if(G.roundState==='fight'){
    G.timeLeft-=dt;
    if(G.timeLeft<=0){ G.timeLeft=0; decideByHp(); }
    return;
  }
  if(G.roundState==='ko'){
    G.koTimer-=dt;
    if(G.koTimer<=0) endFight();
    return;
  }
}
function decideByHp(){
  var w = G.player.hp>=G.enemy.hp ? 'player':'enemy';
  G.winner=w; G.roundState='ko'; G.koTimer=0.6;
  addFloat(480,240,'ВРЕМЯ', '#ffd98a', 44);
  if(w==='player') G.enemy.state='ko'; else G.player.state='ko';
}
function endFight(){
  G.roundState='over';
  if(G.winner==='player'){
    G.wins++;
    G.fight++;
    // лечение перед следующим боем
    G.healCarry=Math.round(G.player.maxHp*0.35);
    if(G.fight>=OPPONENTS.length) showVictory();
    else showWinScreen();         // победа: выбор подушки + усиление
  } else {
    G.lives--;
    if(G.lives<=0) showDefeat();
    else {
      // противник остаётся тем же, но игрок получает утешение
      showLoseScreen();
    }
  }
}

function showWinScreen(){
  G.scene='win'; SFX.win();
  var locked=PILLOWS.filter(function(p){ return G.unlocked.indexOf(p.id)<0; });
  var pillowCards='';
  if(locked.length){
    var opt=locked[irnd(0,locked.length-1)];
    pillowCards='<div class="card" data-p="'+opt.id+'" style="width:250px;margin:0 auto">'
      +'<div class="ic">'+opt.ic+'</div><b>НОВАЯ ПОДУШКА<br>'+opt.name+'</b>'
      +'<i>'+opt.desc+'<br><span style="color:'+opt.col2+'">⚡ Супер: '+opt.superName+'</span><br>'
      +'<span style="color:#9aa0b8">'+opt.superHint+'</span></i></div>';
  } else {
    pillowCards='<p style="color:#8fdcff">Все подушки уже открыты.</p>';
  }
  // текущая подушка игрока — можно переключиться
  var owned=PILLOWS.filter(function(p){ return G.unlocked.indexOf(p.id)>=0; });
  var switchRow='<div style="display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:6px 0">';
  for(var oi=0;oi<owned.length;oi++){
    var pw=owned[oi], on=(pw.id===G.pillow);
    switchRow+='<button class="tab'+(on?' on':'')+'" data-pw="'+pw.id+'" title="'+pw.superName+'">'
      +pw.ic+' '+pw.name+(on?' ✓':'')+'</button>';
  }
  switchRow+='</div>';
  var pool=BONUSES.filter(function(b){ return G.bonusApplied.indexOf(b.id)<0; });
  if(pool.length<3) pool=BONUSES.slice();
  var opts=[];
  while(opts.length<3 && pool.length){ opts.push(pool.splice(irnd(0,pool.length-1),1)[0]); }
  var cards='';
  for(var i=0;i<opts.length;i++){
    cards+='<div class="card" data-b="'+opts[i].id+'"><div class="ic">'+opts[i].ic+'</div>'
      +'<b>'+opts[i].name+'</b><i>'+opts[i].desc+'</i></div>';
  }
  var next=OPPONENTS[G.fight];
  openModal(
    '<div class="modal"><div class="panel">'
    +'<h2>Бой выигран!</h2>'
    +'<p style="margin:4px 0">Побед: <b>'+G.wins+'</b> · Жизней: <b>'+G.lives+'</b> · Впереди: <b>'+next.name+'</b> «'+next.title+'»</p>'
    +'<p style="color:#ffd98a;margin:4px 0">'+next.hint+'</p>'
    +'<h3 style="margin:10px 0 4px">Подушка</h3>'
    + pillowCards
    + switchRow
    +'<h3 style="margin:10px 0 4px">Усиление</h3>'
    +'<div class="cards">'+cards+'</div>'
    +'<button class="btn" id="wNext" style="margin-top:6px">СЛЕДУЮЩИЙ БОЙ →</button>'
    +'</div></div>'
  );
  // переключение подушки
  var pwBtns=ui.querySelectorAll('[data-pw]');
  for(var pi=0;pi<pwBtns.length;pi++){
    pwBtns[pi].onclick=function(){
      G.pillow=this.getAttribute('data-pw');
      SFX.click();
      for(var z=0;z<pwBtns.length;z++) pwBtns[z].classList.remove('on');
      this.classList.add('on');
    };
  }
  var pcard=ui.querySelector('[data-p]');
  if(pcard) pcard.onclick=function(){
    var id=this.getAttribute('data-p');
    if(G.unlocked.indexOf(id)<0){ G.unlocked.push(id); G.pillow=id; }
    this.style.borderColor='#8fff9a'; this.style.opacity='0.72';
    SFX.buy();
  };
  var els=ui.querySelectorAll('[data-b]');
  for(var j=0;j<els.length;j++){
    els[j].onclick=function(){
      applyBonus(this.getAttribute('data-b'));
      this.style.borderColor='#8fff9a'; this.style.opacity='0.72';
    };
  }
  document.getElementById('wNext').onclick=function(){ G.scene='fight'; startFight(); };
}

function applyBonus(id){
  if(G.bonusApplied.indexOf(id)<0) G.bonusApplied.push(id);
  var m=G.mods;
  if(id==='hp'){ m.maxHp+=20; }
  else if(id==='dmg'){ m.dmg*=1.18; }
  else if(id==='spd'){ m.speed*=1.15; }
  else if(id==='rage'){ m.rageGain*=1.5; }
  else if(id==='jump'){ m.jump*=1.12; }
  else if(id==='super'){ m.superMul*=1.25; }
  else if(id==='regen'){ m.regen=1; }
  else if(id==='combo'){ m.comboSpd*=1.2; }
  else if(id==='reach'){ m.reach*=1.12; }
  else if(id==='vamp'){ m.vamp=1; }
  else if(id==='shield'){ m.shield=1; }
  else if(id==='luck'){ m.luck=0.2; m.rageGain*=1.2; }
  SFX.buy();
}

/* ============================================================
   РИСОВАНИЕ: ФОН (гостиная)
   ============================================================ */
function drawBackground(){
  var A=G.arena||ARENAS[0];
  // стена
  var g=ctx.createLinearGradient(0,0,0,FLOOR);
  g.addColorStop(0,A.wall); g.addColorStop(0.55,shadeHex(A.wall,0.85)); g.addColorStop(1,A.wall2);
  ctx.fillStyle=g; ctx.fillRect(0,0,W,FLOOR);

  // свет от лампы (у всех комнат, но разного оттенка)
  var warm = A.theme==='night' ? '#b0c0ff' : (A.theme==='bath' ? '#dff6ff' : '#ffdc96');
  var lg=ctx.createRadialGradient(150,150,20,150,150,430);
  lg.addColorStop(0, hexA(warm,0.26)); lg.addColorStop(1, hexA(warm,0));
  ctx.fillStyle=lg; ctx.fillRect(0,0,W,FLOOR);

  // ---- ДЕКОР ПО ТЕМЕ ----
  if(A.theme==='living'){
    drawWindow(620,90,220,180,'night');
    drawFrame(120,110,110,80,'#8a6fa8','#c9a2e0');
    drawFrame(280,150,86,64,'#7fa88a','#a2e0b8');
    drawCouch(40,300,250,120,'#4f7f6a','#5d9279','#c96f8a','#6f8ac9');
    drawLamp(880,190);
    drawPlant(255,300);
  }
  else if(A.theme==='kitchen'){
    drawWindow(650,80,190,160,'day');
    drawShelf(90,140,180);
    drawFrame(330,120,90,70,'#a88a6f','#e0c9a2');
    drawCounter(30,320,260,100);
    drawStove(700,300);
    drawPlant(520,300);
  }
  else if(A.theme==='attic'){
    drawBeam(0,60); drawBeam(300,60);
    drawCrate(80,320,120,90);
    drawCrate(210,340,90,70);
    drawOldLamp(830,170);
    drawCobweb(20,10); drawCobweb(900,10);
    drawFrame(560,110,80,60,'#8a7a5a','#c0b090');
  }
  else if(A.theme==='bath'){
    drawTiles();
    drawWindow(670,70,170,140,'day');
    drawMirror(120,120,140,150);
    drawBasin(760,320);
    drawShelf(340,150,150);
    drawPlant(40,300);
  }
  else if(A.theme==='night'){
    drawWindow(600,90,240,190,'night');
    drawStars();
    drawFrame(140,130,100,72,'#3a3560','#5a54a0');
    drawCouch(40,300,240,120,'#3a3556','#48426a','#5a4a80','#4a5a80');
    drawLamp(880,190);
    drawMoonlight();
  }
  else if(A.theme==='throne'){
    drawPillars();
    drawThrone(760,240);
    drawTorch(140,160); drawTorch(340,160);
    drawBanner(470,30,140,180);
  }

  // плинтус
  ctx.fillStyle=shadeHex(A.wall2,0.72); ctx.fillRect(0,FLOOR-26,W,26);
  ctx.fillStyle=shadeHex(A.wall2,1.05); ctx.fillRect(0,FLOOR-30,W,6);

  // пол
  var fg=ctx.createLinearGradient(0,FLOOR,0,H);
  fg.addColorStop(0,A.floor); fg.addColorStop(1,A.floor2);
  ctx.fillStyle=fg; ctx.fillRect(0,FLOOR-2,W,H-FLOOR+2);
  // фактура пола
  if(A.theme==='athletic'||A.theme==='bath'){
    ctx.strokeStyle='rgba(0,0,0,0.16)'; ctx.lineWidth=2;
    for(var gx=0;gx<W;gx+=64){ ctx.beginPath(); ctx.moveTo(gx,FLOOR); ctx.lineTo(gx,H); ctx.stroke(); }
  } else {
    ctx.strokeStyle='rgba(0,0,0,0.16)'; ctx.lineWidth=2;
    for(var x=0;x<W;x+=96){ ctx.beginPath(); ctx.moveTo(x,FLOOR); ctx.lineTo(x-30,H); ctx.stroke(); }
  }
  ctx.beginPath(); ctx.moveTo(0,FLOOR+38); ctx.lineTo(W,FLOOR+38); ctx.stroke();

  // коврик арены
  ctx.save();
  ctx.beginPath(); ctx.ellipse(480,H-24,430,44,0,0,6.2832);
  var rg=ctx.createLinearGradient(0,H-50,0,H);
  rg.addColorStop(0, hexA(A.rug,0.62)); rg.addColorStop(1, hexA(A.rug2,0.42));
  ctx.fillStyle=rg; ctx.fill();
  ctx.restore();
}
/* hex + прозрачность -> rgba */
function hexA(hex,a){
  var n=parseInt(hex.slice(1),16);
  return 'rgba('+((n>>16)&255)+','+((n>>8)&255)+','+(n&255)+','+a+')';
}
/* ---- элементы декора ---- */
function drawShelf(x,y,w){
  ctx.fillStyle='#8a6a44'; rr(x,y,w,10,3); ctx.fill();
  ctx.fillStyle='#a07a4a'; rr(x,y,w,3,3); ctx.fill();
  var jars=['#c96f8a','#7fa88a','#d9a34f','#6f8ac9'];
  for(var i=0;i<4;i++){
    ctx.fillStyle=jars[i]; rr(x+12+i*36,y-24,22,24,4); ctx.fill();
    ctx.fillStyle='rgba(255,255,255,.28)'; rr(x+16+i*36,y-20,6,16,3); ctx.fill();
  }
}
function drawCounter(x,y,w,h){
  ctx.fillStyle='rgba(0,0,0,.2)'; ctx.beginPath(); ctx.ellipse(x+w/2,FLOOR-4,w*0.5,12,0,0,6.2832); ctx.fill();
  ctx.fillStyle='#6a5a48'; rr(x,y+18,w,h-18,6); ctx.fill();
  ctx.fillStyle='#c9bfae'; rr(x-6,y,w+12,22,6); ctx.fill();
  ctx.fillStyle='#e0d8c8'; rr(x-4,y+2,w+8,7,3); ctx.fill();
}
function drawStove(x,y){
  ctx.fillStyle='rgba(0,0,0,.2)'; ctx.beginPath(); ctx.ellipse(x+60,FLOOR-4,70,12,0,0,6.2832); ctx.fill();
  ctx.fillStyle='#4a4650'; rr(x,y+20,120,120,6); ctx.fill();
  ctx.fillStyle='#8a8690'; rr(x-4,y,128,26,6); ctx.fill();
  ctx.beginPath(); ctx.arc(x+34,y-6,20,0,6.2832); ctx.fillStyle='#5a565e'; ctx.fill();
  ctx.beginPath(); ctx.arc(x+90,y-6,20,0,6.2832); ctx.fillStyle='#5a565e'; ctx.fill();
  ctx.fillStyle='#2a262e'; ctx.beginPath(); ctx.arc(x+34,y-6,13,0,6.2832); ctx.fill();
  ctx.beginPath(); ctx.arc(x+90,y-6,13,0,6.2832); ctx.fill();
}
function drawBeam(x,y){
  ctx.fillStyle='#4a3a28'; rr(x,y,300,26,6); ctx.fill();
  ctx.fillStyle='#5e4a34'; rr(x,y,300,8,4); ctx.fill();
  ctx.strokeStyle='rgba(0,0,0,.25)'; ctx.lineWidth=2;
  for(var i=0;i<5;i++){ ctx.beginPath(); ctx.moveTo(x+30+i*60,y+8); ctx.lineTo(x+22+i*60,y+26); ctx.stroke(); }
}
function drawCrate(x,y,w,h){
  ctx.fillStyle='rgba(0,0,0,.22)'; ctx.beginPath(); ctx.ellipse(x+w/2,FLOOR-4,w*0.5,11,0,0,6.2832); ctx.fill();
  ctx.fillStyle='#8a6a42'; rr(x,y,w,h,4); ctx.fill();
  ctx.strokeStyle='#6a4e2e'; ctx.lineWidth=4;
  rr(x+4,y+4,w-8,h-8,3); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x+4,y+4); ctx.lineTo(x+w-4,y+h-4); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x+w-4,y+4); ctx.lineTo(x+4,y+h-4); ctx.stroke();
}
function drawOldLamp(x,y){
  var g=ctx.createRadialGradient(x,y,10,x,y,200);
  g.addColorStop(0,'rgba(255,215,140,.34)'); g.addColorStop(1,'rgba(255,215,140,0)');
  ctx.fillStyle=g; ctx.beginPath(); ctx.arc(x,y,200,0,6.2832); ctx.fill();
  ctx.strokeStyle='#3a3028'; ctx.lineWidth=4;
  ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,y-20); ctx.stroke();
  ctx.beginPath(); ctx.arc(x,y,16,0,6.2832); ctx.fillStyle='#ffd98a'; ctx.fill();
  ctx.beginPath(); ctx.arc(x,y,26,0,6.2832); ctx.strokeStyle='rgba(60,50,40,.7)'; ctx.lineWidth=3; ctx.stroke();
}
function drawCobweb(x,y){
  ctx.save(); ctx.strokeStyle='rgba(220,220,230,.28)'; ctx.lineWidth=1.2;
  for(var a=0;a<5;a++){
    ctx.beginPath(); ctx.moveTo(x,y);
    var ang=(a/5)*Math.PI*0.5;
    ctx.lineTo(x+Math.cos(ang)*70, y+Math.sin(ang)*70); ctx.stroke();
  }
  for(var r=1;r<4;r++){
    ctx.beginPath(); ctx.arc(x,y,r*18,0,Math.PI*0.5); ctx.stroke();
  }
  ctx.restore();
}
function drawTiles(){
  var tw=64, th=58;
  for(var y=0;y<FLOOR-26;y+=th){
    for(var x=0;x<W;x+=tw){
      var off=((y/th)%2)*tw/2;
      ctx.fillStyle= ((x+off)/tw%2===0)? 'rgba(255,255,255,.10)':'rgba(255,255,255,.03)';
      ctx.fillRect(x+off,y,tw-2,th-2);
    }
  }
}
function drawMirror(x,y,w,h){
  ctx.fillStyle='#c9d6de'; rr(x-6,y-6,w+12,h+12,10); ctx.fill();
  var g=ctx.createLinearGradient(x,y,x+w,y+h);
  g.addColorStop(0,'#e8f4fa'); g.addColorStop(0.5,'#bfdbe8'); g.addColorStop(1,'#dff0f8');
  ctx.fillStyle=g; rr(x,y,w,h,6); ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,.6)'; ctx.lineWidth=6;
  ctx.beginPath(); ctx.moveTo(x+22,y+16); ctx.lineTo(x+72,y+h-20); ctx.stroke();
}
function drawBasin(x,y){
  ctx.fillStyle='#e8f0f4'; rr(x,y,120,40,14); ctx.fill();
  ctx.fillStyle='#c4d2da'; rr(x+10,y+8,100,14,8); ctx.fill();
  ctx.fillStyle='#8a98a2'; rr(x+52,y+34,16,120,6); ctx.fill();
  ctx.fillStyle='#a8b6c0'; rr(x+40,y+148,40,10,4); ctx.fill();
}
function drawStars(){
  ctx.fillStyle='rgba(255,255,255,.5)';
  for(var i=0;i<16;i++){
    var sx=(i*137)%W, sy=(i*89)%(FLOOR-120);

function drawPillow(x,y,rot,s,col,col2,fx,shape,pillowScale){
  col=col||'#f4f0ff'; col2=col2||'#dcd4ee'; shape=shape||'rect';
  var sc=(pillowScale||1);
  ctx.save();
  ctx.translate(x,y); ctx.rotate(rot); ctx.scale(s*sc,s*sc);

  // форма и габариты зависят от типа подушки
  var bw,bh,br;
  if(shape==='round'){ bw=21; bh=19; br=19; }
  else if(shape==='long'){ bw=27; bh=15; br=13; }
  else if(shape==='tiny'){ bw=15; bh=15; br=14; }
  else if(shape==='big'){ bw=25; bh=22; br=16; }
  else { bw=22; bh=18; br=12; }

  ctx.fillStyle='rgba(0,0,0,.18)'; rr(-bw,-bh,bw*2+2,bh*2+2,br); ctx.fill();

  var g=ctx.createLinearGradient(0,-bh,0,bh);
  if(fx==='rainbow'){
    g.addColorStop(0,'#ffb3e6'); g.addColorStop(0.35,'#ffe08a');
    g.addColorStop(0.7,'#8fd0ff'); g.addColorStop(1,'#b3ffcf');
  } else {
    g.addColorStop(0, shadeHex(col,1.28)); g.addColorStop(0.45,col); g.addColorStop(1,col2);
  }
  ctx.fillStyle=g;

  if(shape==='round'){
    ctx.beginPath(); ctx.arc(0,0,bw,0,6.2832); ctx.fill();
  } else if(shape==='long'){
    // длинная колбаска с защипами
    ctx.beginPath();
    ctx.moveTo(-bw,-bh+3);
    ctx.quadraticCurveTo(-bw-3,0,-bw,-bh+3*0+ (bh-3));
    ctx.quadraticCurveTo(-bw-4,bh,-bw+4,bh);
    ctx.lineTo(bw-4,bh);
    ctx.quadraticCurveTo(bw+4,bh,bw,bh-4);
    ctx.quadraticCurveTo(bw+3,0,bw,-bh+4);
    ctx.quadraticCurveTo(bw+4,-bh,bw-4,-bh);
    ctx.lineTo(-bw+4,-bh);
    ctx.quadraticCurveTo(-bw-4,-bh,-bw,-bh+3);
    ctx.closePath(); ctx.fill();
  } else {
    ctx.beginPath();
    ctx.moveTo(-bw,-bh+4);
    ctx.bezierCurveTo(-bw-2,-bh-2,-bw+6,-bh-2,-bw/2,-bh+1);
    ctx.lineTo(bw/2,-bh+1); ctx.bezierCurveTo(bw-6,-bh-2,bw+2,-bh-2,bw,-bh+4);
    ctx.bezierCurveTo(bw+3,-bh/2,bw+3,bh/2,bw,bh-4);
    ctx.bezierCurveTo(bw+2,bh+2,bw-6,bh+2,bw/2,bh-1);
    ctx.lineTo(-bw/2,bh-1); ctx.bezierCurveTo(-bw+6,bh+2,-bw-2,bh+2,-bw,bh-4);
    ctx.bezierCurveTo(-bw-3,bh/2,-bw-3,-bh/2,-bw,-bh+4);
    ctx.closePath(); ctx.fill();
  }

  // шов (у круглой — по кругу, у остальных — сверху и снизу)
  ctx.strokeStyle='rgba(160,145,190,.55)'; ctx.lineWidth=1.6;
  if(shape==='round'){
    ctx.beginPath(); ctx.arc(0,0,bw*0.72,0,6.2832); ctx.stroke();
  } else {
    ctx.setLineDash([4,4]);
    ctx.beginPath(); ctx.moveTo(-bw+3,-bh+3); ctx.lineTo(bw-3,-bh+3);
    ctx.moveTo(-bw+3,bh-3); ctx.lineTo(bw-3,bh-3); ctx.stroke();
    ctx.setLineDash([]);
  }

  // отметка эффекта
  if(fx==='burn'){ ctx.fillStyle='#e0562a'; ctx.beginPath(); ctx.ellipse(0,1,9,7,0,0,6.2832); ctx.fill();
    ctx.fillStyle='#ffd166'; ctx.beginPath(); ctx.ellipse(0,2,5,4,0,0,6.2832); ctx.fill(); }
  else if(fx==='slow'){ ctx.strokeStyle='#5aa8d8'; ctx.lineWidth=2.4; ctx.beginPath();
    for(var k=0;k<3;k++){ var a=k*Math.PI/3; ctx.moveTo(-Math.cos(a)*9,-Math.sin(a)*9); ctx.lineTo(Math.cos(a)*9,Math.sin(a)*9); } ctx.stroke(); }
  else if(fx==='stun'){ ctx.fillStyle='#ffcf3a'; ctx.beginPath();
    ctx.moveTo(0,-11); ctx.lineTo(6,-2); ctx.lineTo(2,-2); ctx.lineTo(5,10); ctx.lineTo(-3,0); ctx.lineTo(1,0);
    ctx.closePath(); ctx.fill(); }
  else if(fx==='heavy'){ ctx.fillStyle='rgba(90,85,105,.5)'; ctx.beginPath(); ctx.arc(-5,0,5,0,6.2832); ctx.fill();
    ctx.beginPath(); ctx.arc(6,4,4,0,6.2832); ctx.fill(); }

  // блик
  ctx.fillStyle='rgba(255,255,255,.5)';
  ctx.beginPath(); ctx.ellipse(-bw*0.3,-bh*0.45,bw*0.36,bh*0.22,-0.5,0,6.2832); ctx.fill();
  ctx.restore();
}
function drawCat(c){
  var ko=c.state==='ko';
  // след движения (эффект скорости)
  if(c.trail && c.trail.length){
    for(var tr=0;tr<c.trail.length;tr++){
      var t0=c.trail[tr];
      ctx.save();
      ctx.globalAlpha=clamp(t0.life/t0.max,0,1)*0.22;
      ctx.fillStyle=c.fur;
      ctx.translate(t0.x,t0.y);
      ctx.beginPath(); ctx.ellipse(0,-46,34,40,0,0,6.2832); ctx.fill();
      ctx.restore();
    }
  }
  ctx.save();
  ctx.translate(c.x,c.y);
  // масштаб противника (Борис крупнее)
  if(c.scale && c.scale!==1) ctx.scale(c.scale,c.scale);
  // полупрозрачность при телепорте
  if(c.ghost>0) ctx.globalAlpha=clamp(1-c.ghost*2,0.25,1);

  // тень
  var sh=clamp(1-(FLOOR-c.y)/260,0.25,1);
  ctx.save();
  ctx.scale(1,0.3);
  ctx.beginPath(); ctx.arc(0,4,34*sh,0,6.2832);
  ctx.fillStyle='rgba(0,0,0,'+(0.26*sh)+')'; ctx.fill();
  ctx.restore();

  if(ko){
    // лежит на спине
    ctx.rotate(-1.35*c.facing);
    ctx.translate(0,-22);
  }

  ctx.scale(c.facing,1);

  // параметры позы
  var acting=!!c.act;
  var a=c.act;
  var idle=Math.sin(c.anim*2.2)*1.6;
  var walkBob=Math.sin(c.walk)*3;
  var bodyY=-64+(c.onGround? idle : -4);

  // наклон вперёд при ударе — выразительнее
  var lean=0, crouch=0;
  if(acting){
    var s=a.spec, tot=s.windup+s.active+s.recover, t=a.t;
    if(t<s.windup){ lean=-0.30*(t/s.windup); crouch=0.12*(t/s.windup); }          // замах назад
    else if(t<s.windup+s.active){ lean=0.55*ease((t-s.windup)/s.active); crouch=-0.10; }  // рывок вперёд
    else lean=0.55*(1-ease((t-s.windup-s.active)/s.recover));                     // возврат
  }
  if(c.hitStun>0) lean=-0.45*clamp(c.hitStun/0.4,0,1);
  if(ko) lean=0;
  ctx.translate(0,bodyY+crouch*40);
  ctx.rotate(lean*0.30);

  // ---- ХВОСТ: пушистый, с изгибом и утолщением у основания ----
  var tailWave=Math.sin(c.anim*2.6)*9 + (c.isPlayer?0:2);
  var tailBase=-24, tailUp=-46;
  ctx.save();
  // тень хвоста
  ctx.strokeStyle=c.fur2; ctx.lineWidth=15; ctx.lineCap='round';
  ctx.beginPath();
  ctx.moveTo(tailBase,12);
  ctx.bezierCurveTo(-58,6, -66,-26+tailWave*0.5, -42,-52+tailWave);
  ctx.stroke();
  // основная шерсть
  ctx.strokeStyle=c.fur; ctx.lineWidth=11;
  ctx.beginPath();
  ctx.moveTo(tailBase,12);
  ctx.bezierCurveTo(-55,7, -62,-24+tailWave*0.5, -40,-49+tailWave);
  ctx.stroke();
  // светлая кисточка на кончике
  ctx.strokeStyle=shadeHex(c.belly,1.02); ctx.lineWidth=9;
  ctx.beginPath();
  ctx.moveTo(-48,-38+tailWave*0.6);
  ctx.quadraticCurveTo(-46,-46+tailWave*0.8,-40,-49+tailWave);
  ctx.stroke();
  // пушистые «язычки» шерсти вдоль хвоста
  ctx.strokeStyle=shadeHex(c.fur,1.14); ctx.lineWidth=2.4;
  for(var tf=0;tf<4;tf++){
    var tp=tf/4;
    var tx=lerp(tailBase,-42,tp), ty=lerp(12,-50+tailWave,tp);
    ctx.beginPath(); ctx.moveTo(tx,ty); ctx.lineTo(tx-6,ty-5); ctx.stroke();
  }
  ctx.restore();

  // ---- ЗАДНИЕ ЛАПЫ: бедро + лапа с пальцами ----
  var legPhase=c.walk;
  // дальняя задняя лапа (темнее, за телом)

  // корпус: более кошачьи пропорции — вытянутый, с холкой

  bg.addColorStop(0, shadeHex(c.fur,1.10));
  bg.addColorStop(0.45,c.fur);
  bg.addColorStop(1,c.fur2);
  ctx.fillStyle=bg;
  ctx.beginPath();
  ctx.moveTo(-26,-4);                                   // зад
  ctx.quadraticCurveTo(-32,-26,-16,-38);                // спина назад
  ctx.quadraticCurveTo(2,-48,20,-40);                   // холка к шее
  ctx.quadraticCurveTo(32,-32,30,-8);                   // грудь
  ctx.quadraticCurveTo(28,14,10,22);                    // низ груди
  ctx.quadraticCurveTo(-8,26,-22,18);                   // живот
  ctx.quadraticCurveTo(-30,10,-26,-4);                  // к бедру
  ctx.closePath(); ctx.fill();
