  var bl=ctx.createLinearGradient(0,-10,0,24);
  bl.addColorStop(0, shadeHex(c.belly,1.06)); bl.addColorStop(1,c.belly);
  ctx.fillStyle=bl;
  ctx.beginPath();
  ctx.ellipse(10,8,19,15,0.15,0,6.2832); ctx.fill();

  // полоски/пятна на спине
  ctx.save();
  ctx.globalAlpha=0.16; ctx.strokeStyle='#000'; ctx.lineWidth=3.4; ctx.lineCap='round';
  ctx.beginPath();
  ctx.moveTo(-14,-28); ctx.quadraticCurveTo(-12,-16,-14,-6);
  ctx.moveTo(-2,-34);  ctx.quadraticCurveTo(1,-20,-1,-8);
  ctx.moveTo(10,-34);  ctx.quadraticCurveTo(13,-22,11,-10);
  ctx.stroke();
  ctx.restore();

  // пушистая шерсть на контуре (мелкие штрихи)
  ctx.save();
  ctx.strokeStyle=shadeHex(c.fur,1.16); ctx.lineWidth=2; ctx.globalAlpha=0.5;
  for(var sf=0;sf<5;sf++){
    var sx=-22+sf*11, sy=-30+Math.sin(sf*1.7)*5;
    ctx.beginPath(); ctx.moveTo(sx,sy); ctx.lineTo(sx-5,sy-6); ctx.stroke();
  }
  ctx.restore();

  // ближняя задняя лапа
  drawHaunch(c,16, Math.sin(legPhase)*5, 1);

  // ---- ГОЛОВА ----
  var headY=-52+ (acting?2:0);
  ctx.save();
  ctx.translate(13,headY);
  var nod=acting? (a.t< a.spec.windup ? -0.12 : 0.2) : Math.sin(c.anim*2.2+1)*0.035;
  ctx.rotate(nod*0.8);
  // уши (с внутренним мехом и кисточками)
  drawEarReal(-14,-13,-0.42,c.fur,c.ear,c.fur2);
  drawEarReal(10,-15,0.30,c.fur,c.ear,c.fur2);
  // шея
  ctx.fillStyle=shadeHex(c.fur,0.94);
  ctx.beginPath(); ctx.ellipse(-6,16,16,12,0,0,6.2832); ctx.fill();
  // череп с бакенбардами (кошачья морда: широкие щёки снизу)
  var hg=ctx.createRadialGradient(-3,-8,4,0,2,30);
  hg.addColorStop(0, shadeHex(c.fur,1.16)); hg.addColorStop(0.7,c.fur); hg.addColorStop(1,shadeHex(c.fur,0.92));
  ctx.fillStyle=hg;
  ctx.beginPath();
  ctx.moveTo(0,-24);
  ctx.bezierCurveTo(16,-24, 24,-12, 24,2);          // правое ухо к щеке
  ctx.bezierCurveTo(26,14, 20,22, 10,22);           // правая щека
  ctx.quadraticCurveTo(0,24,-10,22);                // подбородок
  ctx.bezierCurveTo(-20,22,-26,14,-24,2);           // левая щека
  ctx.bezierCurveTo(-24,-12,-16,-24,0,-24);         // левое ухо
  ctx.closePath(); ctx.fill();

  // бакенбарды — пушистые пучки по бокам
  ctx.save();
  ctx.fillStyle=shadeHex(c.fur,1.06);
  for(var cb=0;cb<3;cb++){
    var cy=-6+cb*9;
    ctx.beginPath(); ctx.moveTo(-22,cy); ctx.lineTo(-31,cy+2); ctx.lineTo(-22,cy+5); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(22,cy); ctx.lineTo(31,cy+2); ctx.lineTo(22,cy+5); ctx.closePath(); ctx.fill();
  }
  ctx.restore();

  // светлая морда вокруг носа
  var mg=ctx.createRadialGradient(3,8,2,3,8,15);
  mg.addColorStop(0, shadeHex(c.belly,1.06)); mg.addColorStop(1,c.belly);
  ctx.fillStyle=mg;
  ctx.beginPath(); ctx.ellipse(3,9,13,10,0,0,6.2832); ctx.fill();

  // глаза — крупные, с радужкой, зрачком и двумя бликами
  var blinking=c.blinking>0||ko;
  var hurt=c.hurtFlash>0;
  function drawEye(ex,ey,flipSide){
    // веко/глазница
    ctx.fillStyle='rgba(20,14,30,.10)';
    ctx.beginPath(); ctx.ellipse(ex,ey-1,9,9.5,0,0,6.2832); ctx.fill();
    // склера
    ctx.fillStyle='#fdfbf4';
    ctx.beginPath(); ctx.ellipse(ex,ey,7.6,8.2,0,0,6.2832); ctx.fill();
    // радужка
    var ir=hurt? 1.6 : 5.0;
    var ix=ex+(hurt?-1:0)+ (actFocus?1:0);
    ctx.fillStyle=c.eye;
    ctx.beginPath(); ctx.ellipse(ix,ey,ir,ir*1.06,0,0,6.2832); ctx.fill();
    // зрачок — вертикальная щель (кошачий)
    ctx.fillStyle='#120c1c';
    ctx.beginPath(); ctx.ellipse(ix,ey,1.5,ir*0.95,0,0,6.2832); ctx.fill();
    // верхнее веко
    ctx.strokeStyle=shadeHex(c.fur,0.8); ctx.lineWidth=2; ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(ex-8,ey-7); ctx.quadraticCurveTo(ex,ey-10,ex+8,ey-7); ctx.stroke();
    // блики
    ctx.fillStyle='rgba(255,255,255,.95)';
    ctx.beginPath(); ctx.arc(ix-2.4,ey-2.6,1.7,0,6.2832); ctx.fill();
    ctx.beginPath(); ctx.arc(ix+2.2,ey+2.2,0.9,0,6.2832); ctx.fill();
  }
  var actFocus = acting && a.t>a.spec.windup;
  if(ko){
    ctx.strokeStyle='#2b2140'; ctx.lineWidth=2.6; ctx.lineCap='round';
    crossEye(-7,-2); crossEye(7,-2);
  } else if(blinking){
    ctx.strokeStyle='#2b2140'; ctx.lineWidth=2.4; ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(-13,-2); ctx.quadraticCurveTo(-7,2,-1,-2); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(3,-2); ctx.quadraticCurveTo(9,2,15,-2); ctx.stroke();
  } else {
    drawEye(-7,-2,false);
    drawEye(8,-2,true);
  }

  // нос — треугольный, с ноздрями и «галстуком»
  ctx.fillStyle='#e8788f';
  ctx.beginPath();
  ctx.moveTo(1,7); ctx.quadraticCurveTo(4,5.6,7,7);
  ctx.quadraticCurveTo(6,10.5,4,10.9);
  ctx.quadraticCurveTo(2,10.5,1,7); ctx.closePath(); ctx.fill();
  ctx.fillStyle='rgba(120,40,60,.5)';
  ctx.beginPath(); ctx.ellipse(2.6,8.2,0.8,0.6,0,0,6.2832); ctx.fill();
  ctx.beginPath(); ctx.ellipse(5.4,8.2,0.8,0.6,0,0,6.2832); ctx.fill();
  // рот — кошачья «улыбка» с ямочкой
  ctx.strokeStyle='#3a2a34'; ctx.lineWidth=1.7; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(4,11); ctx.lineTo(4,13.4); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(4,13.4); ctx.quadraticCurveTo(0.5,16.4,-1.8,12.4); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(4,13.4); ctx.quadraticCurveTo(7.5,16.4,9.8,12.4); ctx.stroke();
  ctx.beginPath(); ctx.arc(-1.6,12.6,0.9,0,6.2832); ctx.fillStyle='rgba(60,40,50,.4)'; ctx.fill();
  ctx.beginPath(); ctx.arc(9.6,12.6,0.9,0,6.2832); ctx.fill();

  // усы — по 3 с каждой стороны, чуть изогнутые, с утолщением
  ctx.save();
  ctx.strokeStyle='rgba(255,255,255,.92)'; ctx.lineCap='round';
  for(var wsi=0;wsi<3;wsi++){
    var wy=3+wsi*3.4, wlen=20-wsi*2.2, wsag=(wsi-1)*2.6;
    ctx.lineWidth=1.7-wsi*0.2;
    ctx.beginPath();
    ctx.moveTo(11.5,wy);
    ctx.quadraticCurveTo(11.5+wlen*0.6, wy-1.6+wsag*0.4, 11.5+wlen, wy+wsag);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(-1.5,wy+0.6);
    ctx.quadraticCurveTo(-1.5-wlen*0.6, wy-1.8+wsag*0.4, -1.5-wlen, wy+wsag);
    ctx.stroke();
  }
  ctx.restore();
  ctx.restore();

  // передняя лапа с подушкой
  var shoulderX=16, shoulderY=-24;
  var pl=(c.isPlayer?pillow():{col:'#fdf6ff',col2:'#dcd4ee',fx:null,shape:'rect',size:1});
  ctx.save();
  ctx.translate(shoulderX,shoulderY);
  var armAng;
  if(acting){
    armAng=drawSwingArc(c, a.spec, a.t);
    ctx.rotate(armAng);
    // лапа вытянута
    ctx.strokeStyle=c.fur; ctx.lineWidth=11; ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(38,0); ctx.stroke();
    ctx.fillStyle=c.fur2;
    ctx.beginPath(); ctx.arc(38,0,7,0,6.2832); ctx.fill();
    // подушка в момент удара и замаха
    ctx.save();
    ctx.translate(48,0);
    ctx.rotate(armAng>0.2? 0.55 : -0.35);
    drawPillow(0,0,0,1.12,pl.col,pl.col2,pl.fx,pl.shape,pl.size);
    ctx.restore();
  } else {
    // покой: подушка в лапе у бедра, лёгкое покачивание
    armAng=0.25+Math.sin(c.anim*1.8)*0.04;
    ctx.rotate(armAng);
    ctx.strokeStyle=c.fur; ctx.lineWidth=11; ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(28,14); ctx.stroke();
    drawPillow(34,20,0.4,0.95,pl.col,pl.col2,pl.fx,pl.shape,pl.size);
  }
  ctx.restore();

  // вспышка урона
  if(c.hurtFlash>0 && !ko){
    ctx.save();
    ctx.globalAlpha=clamp(c.hurtFlash*2.2,0,0.55);
    ctx.fillStyle='#ff5a5a';
    ctx.beginPath(); ctx.ellipse(4,-14,40,52,0,0,6.2832); ctx.fill();
    ctx.restore();
  }
  // вспышка сверх-удара
  if(c.superFlash>0){
    ctx.save();
    ctx.globalAlpha=clamp(c.superFlash*2.0,0,0.8);
    var sg=ctx.createRadialGradient(4,-14,10,4,-14,110);
    sg.addColorStop(0,'rgba(255,230,140,.95)');
    sg.addColorStop(1,'rgba(255,180,80,0)');
    ctx.fillStyle=sg;
    ctx.beginPath(); ctx.arc(4,-14,110,0,6.2832); ctx.fill();
    ctx.restore();
  } else if(c.rage>=RAGE_MAX){
    // мягкое свечение, когда ярость готова
    ctx.save();
    ctx.globalAlpha=0.25+0.2*Math.sin(G.t*9);
    ctx.fillStyle='#ffd166';
    ctx.beginPath(); ctx.ellipse(4,-14,46,58,0,0,6.2832); ctx.fill();
    ctx.restore();
  }
  ctx.restore();
}
function crossEye(x,y){
  ctx.beginPath();
  ctx.moveTo(x-3,y-3); ctx.lineTo(x+3,y+3);
  ctx.moveTo(x+3,y-3); ctx.lineTo(x-3,y+3);
  ctx.stroke();
}
function drawLeg(c,x,off,fur,fur2){
  ctx.strokeStyle=fur; ctx.lineWidth=13; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(x,20); ctx.lineTo(x+off*0.6,54); ctx.stroke();
  ctx.fillStyle=fur2;
  ctx.beginPath(); ctx.ellipse(x+off*0.6+3,58,10,6,0,0,6.2832); ctx.fill();
}
/* задняя лапа: бедро-«окорок» + голень + ступня с пальцами */
function drawHaunch(c,x,off,dim){
  var fur = dim<1? shadeHex(c.fur,0.88) : c.fur;
  var fur2= dim<1? shadeHex(c.fur2,0.88) : c.fur2;
  ctx.save();
  // бедро — округлый мускул
  ctx.fillStyle=fur;
  ctx.beginPath(); ctx.ellipse(x-2,10,17,19,0,0,6.2832); ctx.fill();
  // голень и ступня
  ctx.strokeStyle=fur; ctx.lineWidth=13; ctx.lineCap='round';
  ctx.beginPath();
  ctx.moveTo(x+2,22);
  ctx.quadraticCurveTo(x+off*0.5,40, x+off*0.7+2,52);
  ctx.stroke();
  // ступня
  ctx.fillStyle=fur2;
  ctx.beginPath(); ctx.ellipse(x+off*0.7+5,55,11,6.5,0,0,6.2832); ctx.fill();
  // пальцы
  ctx.strokeStyle=shadeHex(fur2,0.82); ctx.lineWidth=1.4;
  for(var t=0;t<3;t++){
    var tx=x+off*0.7+1+t*4;
    ctx.beginPath(); ctx.moveTo(tx,52); ctx.lineTo(tx+1,58); ctx.stroke();
  }
  ctx.restore();
}
/* реалистичное ухо: треугольник с наружным мехом, внутренним и кисточкой */
function drawEarReal(x,y,rot,fur,inner,fur2){
  ctx.save();
  ctx.translate(x,y); ctx.rotate(rot);
  // внешнее ухо
  ctx.beginPath();
  ctx.moveTo(-12,10);
  ctx.quadraticCurveTo(-10,-8,-2,-22);
  ctx.quadraticCurveTo(6,-10,13,9);
  ctx.quadraticCurveTo(1,16,-12,10);
  ctx.closePath();
  var eg=ctx.createLinearGradient(0,-22,0,10);
  eg.addColorStop(0,shadeHex(fur,1.12)); eg.addColorStop(1,fur);
  ctx.fillStyle=eg; ctx.fill();
  // тень по краю
  ctx.strokeStyle=shadeHex(fur2,0.9); ctx.lineWidth=1.6;
  ctx.beginPath(); ctx.moveTo(-12,10); ctx.quadraticCurveTo(-10,-8,-2,-22); ctx.stroke();
  // внутреннее ухо
  ctx.beginPath();
  ctx.moveTo(-6,7);
  ctx.quadraticCurveTo(-5,-5,0,-15);
  ctx.quadraticCurveTo(5,-4,8,6);
  ctx.quadraticCurveTo(1,11,-6,7);
  ctx.closePath();
  var ig=ctx.createLinearGradient(0,-15,0,7);
  ig.addColorStop(0, shadeHex(inner,1.1)); ig.addColorStop(1,inner);
  ctx.fillStyle=ig; ctx.fill();
  // шерстинки у основания
  ctx.strokeStyle=shadeHex(fur,1.2); ctx.lineWidth=1.5; ctx.lineCap='round';
  for(var f=0;f<3;f++){
    ctx.beginPath();
    ctx.moveTo(-9+f*7,9);
    ctx.lineTo(-11+f*7,14);
    ctx.stroke();
  }
  // кисточки на кончике
  ctx.strokeStyle=shadeHex(fur,1.25); ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(-2,-22); ctx.lineTo(-4,-28); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-2,-22); ctx.lineTo(1,-27); ctx.stroke();
  ctx.restore();
}
function drawEar(x,y,rot,fur,inner){
  ctx.save();
  ctx.translate(x,y); ctx.rotate(rot);
  ctx.beginPath();
  ctx.moveTo(-11,8); ctx.lineTo(1,-20); ctx.lineTo(12,8);
  ctx.quadraticCurveTo(0,14,-11,8); ctx.closePath();
  ctx.fillStyle=fur; ctx.fill();
  ctx.beginPath();
  ctx.moveTo(-5,6); ctx.lineTo(1,-11); ctx.lineTo(7,6);
  ctx.quadraticCurveTo(0,10,-5,6); ctx.closePath();
  ctx.fillStyle=inner; ctx.fill();
  ctx.restore();
}
function shadeHex(hex,f){
  var n=parseInt(hex.slice(1),16);
  var r=Math.min(255,Math.round(((n>>16)&255)*f));
  var g=Math.min(255,Math.round(((n>>8)&255)*f));
  var b=Math.min(255,Math.round((n&255)*f));
  return 'rgb('+r+','+g+','+b+')';
}

/* ============================================================
   РИСОВАНИЕ: АНИМАЦИИ УДАРОВ
   ============================================================ */
/* след удара — яркая дуга с искрами по направлению взмаха */
function drawSwingArc(c, sp, t){
  var prog;
  if(t<sp.windup) prog=-0.35*(t/sp.windup);
  else if(t<sp.windup+sp.active) prog=lerp(-0.35,1,(t-sp.windup)/sp.active);
  else prog=lerp(1,-0.12,(t-sp.windup-sp.active)/sp.recover);
  var a0=sp.arc[0], a1=sp.arc[1];
  var armAng=lerp(a0,a1, clamp(prog+0.35,0,1.35)/1.35);
  var inActive = t>=sp.windup && t<=sp.windup+sp.active;
  if(!inActive && t<sp.windup) return armAng;

  var heavyArc=sp.finisher||sp.dive;
  ctx.save();
  // свечение вокруг подушки в момент удара
  if(inActive){
    var fxCol2 = sp.fx==='burn'?'#ffb066': sp.fx==='slow'?'#bfe9ff': sp.fx==='stun'?'#fff6a8':
                sp.fx==='rainbow'?'#ffb3e6':'#ffffff';
    ctx.globalAlpha=0.35;
    var gg=ctx.createRadialGradient(0,0,sp.reach*0.3,0,0,sp.reach*1.15);
    gg.addColorStop(0,'rgba(255,255,255,0)'); gg.addColorStop(1,fxCol2);
    ctx.fillStyle=gg;
    ctx.beginPath(); ctx.arc(0,0,sp.reach*1.15,0,6.2832); ctx.fill();
  }
  ctx.globalAlpha=0.55;
  ctx.strokeStyle= heavyArc? 'rgba(255,225,150,.75)':'rgba(255,255,255,.6)';
  ctx.lineWidth=heavyArc?17:11; ctx.lineCap='round';
  ctx.beginPath(); ctx.arc(0,0,sp.reach*0.86, armAng-0.8, armAng+0.3); ctx.stroke();
  // внешняя светящаяся кромка
  ctx.globalAlpha=0.28;
  ctx.strokeStyle='#ffffff'; ctx.lineWidth=heavyArc?7:4;
  ctx.beginPath(); ctx.arc(0,0,sp.reach*0.95, armAng-0.7, armAng+0.2); ctx.stroke();
  // искры по дуге
  if(inActive){
    var fxCol = sp.fx==='burn'?'#ffb066': sp.fx==='slow'?'#bfe9ff': sp.fx==='stun'?'#fff6a8':
                sp.fx==='rainbow'?'#ffb3e6':'#ffffff';
    for(var i=0;i<4;i++){
      var aa=armAng-0.6+ i*0.28 + rnd(-0.05,0.05);
      var rr2=sp.reach*(0.7+ rnd(0,0.35));
      ctx.globalAlpha=rnd(0.35,0.8);
      ctx.fillStyle=fxCol;
      ctx.beginPath(); ctx.arc(Math.cos(aa)*rr2, Math.sin(aa)*rr2, rnd(1.4,3.2), 0, 6.2832); ctx.fill();
    }
  }
  ctx.restore();
  return armAng;
}

function drawHitMarks(dt){
  for(var i=0;i<G.hitMarks.length;i++){
    var h=G.hitMarks[i];
    h.life-=dt;
    var t=1-h.life/h.max;
    var a=clamp(h.life/h.max,0,1);
    ctx.save();
    ctx.globalAlpha=a*0.95;
    ctx.translate(h.x,h.y); ctx.rotate(h.rot);
    ctx.scale(h.scale*(0.6+t*0.7), h.scale*(0.6+t*0.7));
    // звезда-вспышка
    ctx.fillStyle=h.col;
    ctx.beginPath();
    for(var k=0;k<8;k++){
      var ang=k*Math.PI/4, rad=(k%2===0)?18:7;
      var xx=Math.cos(ang)*rad, yy=Math.sin(ang)*rad;
      if(k===0) ctx.moveTo(xx,yy); else ctx.lineTo(xx,yy);
    }
    ctx.closePath(); ctx.fill();
    ctx.globalAlpha=a*0.6;
    ctx.strokeStyle='#ffffff'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.arc(0,0,20*(0.5+t),0,6.2832); ctx.stroke();
    ctx.restore();
  }
  G.hitMarks=G.hitMarks.filter(function(h){ return h.life>0; });
}
function drawShockwaves(dt){
  for(var i=0;i<G.shockwaves.length;i++){
    var s=G.shockwaves[i];
    s.life-=dt;
    var t=1-s.life/s.maxLife;
    var r=lerp(s.r,s.max,ease(clamp(t,0,1)));
    ctx.save();
    ctx.globalAlpha=clamp(s.life/s.maxLife,0,1)*0.6;
    ctx.strokeStyle=s.col||'#ffd166'; ctx.lineWidth=7*(1-t);
    ctx.beginPath(); ctx.ellipse(s.x,s.y,r,r*0.32,0,0,6.2832); ctx.stroke();
    ctx.globalAlpha=clamp(s.life/s.maxLife,0,1)*0.28;
    ctx.lineWidth=3*(1-t);
    ctx.beginPath(); ctx.ellipse(s.x,s.y,r*0.7,r*0.22,0,0,6.2832); ctx.stroke();
    ctx.restore();
  }
  G.shockwaves=G.shockwaves.filter(function(s){ return s.life>0; });
}
/* ореол эффекта вокруг кота (горение/заморозка) */
function drawStatusFx(c){
  if(c.state==='ko') return;
  if(c.burnT>0){
    ctx.save();
    ctx.globalAlpha=0.5+0.3*Math.sin(G.t*14);
    for(var i=0;i<4;i++){
      var fx=c.x+rnd(-16,16), fy=c.y-20-rnd(0,50);
      ctx.fillStyle= i%2? '#ff9a4d':'#ffd166';
      ctx.beginPath(); ctx.ellipse(fx,fy,rnd(3,6),rnd(6,11),0,0,6.2832); ctx.fill();
    }
    ctx.restore();
  }
  if(c.slowT>0){
    ctx.save();
    ctx.globalAlpha=0.30+0.15*Math.sin(G.t*5);
    ctx.fillStyle='#8fdcff';
    ctx.beginPath(); ctx.ellipse(c.x,c.y-46,38,52,0,0,6.2832); ctx.fill();
    ctx.globalAlpha=0.6;
    ctx.strokeStyle='#dff6ff'; ctx.lineWidth=2;
    for(var k=0;k<3;k++){
      var aa=k*2.1+G.t*0.6;
      ctx.beginPath();
      ctx.moveTo(c.x+Math.cos(aa)*40, c.y-46+Math.sin(aa)*54);
      ctx.lineTo(c.x+Math.cos(aa)*46, c.y-46+Math.sin(aa)*60);
      ctx.stroke();
    }
    ctx.restore();
  }
}

function drawDust(dt){
  for(var i=0;i<G.dust.length;i++){
    var d=G.dust[i];
    d.life-=dt;
    d.x+=d.vx*dt; d.y+=d.vy*dt;
    d.vx*=0.94; d.vy*=0.94; d.r*=1.02;
    var a=clamp(d.life/d.max,0,1);
    ctx.save();
    ctx.globalAlpha=a*0.55;
    ctx.fillStyle=d.col;
    ctx.beginPath(); ctx.arc(d.x,d.y,d.r,0,6.2832); ctx.fill();
    ctx.restore();
  }
  G.dust=G.dust.filter(function(d){ return d.life>0; });
}
/* линии скорости при рывке и в воздухе */
function drawSpeedLines(c){
  var fast = Math.abs(c.vx)>230 || (!c.onGround && Math.abs(c.vy)>300);
  if(!fast || c.state==='ko') return;
  ctx.save();
  ctx.globalAlpha=0.22;
  ctx.strokeStyle=c.isPlayer?'#ffe9b0':'#dfe6ff';
  ctx.lineWidth=2; ctx.lineCap='round';
  for(var i=0;i<3;i++){
    var yy=c.y-70+rnd(-30,20), len=rnd(14,30);
    ctx.beginPath();
    ctx.moveTo(c.x-c.facing*26, yy);
    ctx.lineTo(c.x-c.facing*(26+len), yy);
    ctx.stroke();
  }
  ctx.restore();
}
/* вспышка экрана при крупном комбо */
function drawComboFlash(){
  if(G.comboFlash<=0) return;
  var a=clamp(G.comboFlash/0.5,0,1);
  ctx.save();
  ctx.globalAlpha=a*0.16;
  ctx.fillStyle=G.comboFlashCol;
  ctx.fillRect(0,0,W,H);
  ctx.restore();
}

/* лучи от супер-атак: цепь, пламя, лёд, призма */
function drawBeams(dt){
  for(var i=0;i<G.beams.length;i++){
    var b=G.beams[i];
    var t=clamp(b.life/b.maxLife,0,1);
    ctx.save();
    if(b.kind==='chain'){
      // ломаная молния
      ctx.globalAlpha=t;
      ctx.strokeStyle=b.col; ctx.lineWidth=7*t+2; ctx.lineJoin='round';
      ctx.beginPath();
      ctx.moveTo(b.x1,b.y1);
      var seg=9;
      for(var s=1;s<seg;s++){
        var p=s/seg;
        var mx=lerp(b.x1,b.x2,p), my=lerp(b.y1,b.y2,p);
        var zig=Math.sin(p*22+b.seed)*16*(1-p*0.4);
        ctx.lineTo(mx, my+zig);
      }
      ctx.lineTo(b.x2,b.y2); ctx.stroke();
      ctx.strokeStyle='#ffffff'; ctx.lineWidth=2.4*t; ctx.stroke();
    }
    else if(b.kind==='fire'){
      ctx.globalAlpha=t*0.85;
      var fg=ctx.createLinearGradient(b.x1,b.y1,b.x2,b.y2);
      fg.addColorStop(0,'rgba(255,220,140,.9)'); fg.addColorStop(0.5,'rgba(255,140,60,.8)');
      fg.addColorStop(1,'rgba(200,60,30,0)');
      ctx.fillStyle=fg;
      ctx.beginPath();
      ctx.moveTo(b.x1,b.y1-40); ctx.lineTo(b.x2,b.y2-70);
      ctx.lineTo(b.x2,b.y2+70); ctx.lineTo(b.x1,b.y1+40); ctx.closePath(); ctx.fill();
    }
    else if(b.kind==='ice'){
      ctx.globalAlpha=t*0.9;
      ctx.strokeStyle=b.col; ctx.lineWidth=10*t; ctx.lineCap='round';
      ctx.beginPath(); ctx.moveTo(b.x1,b.y1); ctx.lineTo(b.x2,b.y2); ctx.stroke();
      ctx.strokeStyle='#ffffff'; ctx.lineWidth=3*t;
      ctx.beginPath(); ctx.moveTo(b.x1,b.y1); ctx.lineTo(b.x2,b.y2); ctx.stroke();
      // кристаллы
      for(var c=0;c<5;c++){
        var cp=(c+1)/6;
        var cx=lerp(b.x1,b.x2,cp), cy=lerp(b.y1,b.y2,cp);
        ctx.globalAlpha=t*0.8; ctx.fillStyle=b.col;
        ctx.beginPath();
        ctx.moveTo(cx,cy-16); ctx.lineTo(cx+9,cy); ctx.lineTo(cx,cy+16); ctx.lineTo(cx-9,cy);
        ctx.closePath(); ctx.fill();
      }
    }
    else { // prism — радужный луч
      var pgrad=ctx.createLinearGradient(b.x1,b.y1,b.x2,b.y2);
      pgrad.addColorStop(0,'#ffb3e6'); pgrad.addColorStop(0.35,'#ffe08a');
      pgrad.addColorStop(0.65,'#8fd0ff'); pgrad.addColorStop(1,'#b3ffcf');
      ctx.globalAlpha=t;
      ctx.fillStyle=pgrad;
      var th=(38*t);
      ctx.beginPath();
      ctx.moveTo(b.x1,b.y1-th); ctx.lineTo(b.x2,b.y2-th*0.4);
      ctx.lineTo(b.x2,b.y2+th*0.4); ctx.lineTo(b.x1,b.y1+th); ctx.closePath(); ctx.fill();
      ctx.globalAlpha=t*0.6; ctx.fillStyle='#ffffff';
      ctx.beginPath();
      ctx.moveTo(b.x1,b.y1-th*0.3); ctx.lineTo(b.x2,b.y2-th*0.12);
      ctx.lineTo(b.x2,b.y2+th*0.12); ctx.lineTo(b.x1,b.y1+th*0.3); ctx.closePath(); ctx.fill();
    }
    ctx.restore();
  }
}

/* ============================================================
   РИСОВАНИЕ: HUD, ЧАСТИЦЫ
   ============================================================ */
function drawHealthBar(x,y,w,h,pct,c1,c2,flip){
  ctx.save();
  // фон
  rr(x,y,w,h,h/2);
  ctx.fillStyle='rgba(20,14,32,.72)'; ctx.fill();
  // заполнение внутри скруглённой рамки
  ctx.save();
  ctx.beginPath(); rr(x+3,y+3,w-6,h-6,(h-6)/2); ctx.clip();
  var bw=(w-6)*clamp(pct,0,1);
  var g=ctx.createLinearGradient(x,y,x+w,y);
  g.addColorStop(0,c1); g.addColorStop(1,c2);
  ctx.fillStyle=g;
  if(flip){
    // у врага полоска убывает справа налево
    ctx.fillRect(x+w-3-bw, y+3, bw, h-6);
  } else {
    ctx.fillRect(x+3, y+3, bw, h-6);
  }
  ctx.restore();
  // рамка
  ctx.lineWidth=2; ctx.strokeStyle='rgba(255,255,255,.22)';
  rr(x+1,y+1,w-2,h-2,(h-2)/2); ctx.stroke();
  ctx.restore();
}
function drawHud(){
  var p=G.player, e=G.enemy;
  var barW=340, barH=26;

  // игрок
  ctx.textAlign='left';
  ctx.fillStyle='rgba(10,6,18,.55)';
  rr(30,26,barW+16,72,18); ctx.fill();
  drawHealthBar(38,34,barW,barH, p.hp/p.maxHp, '#ff9a4d','#ffd98a', false);
  // шкала ярости: мигает и светится, когда готова
  var rageReady = p.rage>=RAGE_MAX;
  var glow = rageReady ? (0.55+0.45*Math.sin(G.t*10)) : 1;
  drawHealthBar(38,66,barW*0.8,12, p.rage/RAGE_MAX, '#8a3df0','#ffd166', false);
  ctx.font='700 17px "Segoe UI",sans-serif';
  ctx.fillStyle='#ffd98a'; ctx.fillText(p.name+'  ❤ '+Math.ceil(p.hp), 40, 22);
  if(rageReady){
    ctx.save();
    ctx.globalAlpha=0.55+0.45*Math.sin(G.t*10);
    ctx.font='800 12px "Segoe UI",sans-serif';
    ctx.fillStyle='#ffd166';
    ctx.fillText('⚡ U', 38+barW*0.8+66, 76);
    ctx.restore();
    // название супер-атаки текущей подушки
    ctx.save();
    ctx.globalAlpha=0.8+0.2*Math.sin(G.t*6);
    ctx.font='800 12px "Segoe UI",sans-serif';
    ctx.fillStyle=pillow().col2;
    ctx.fillText(superLabel(), 38, 90);
    ctx.restore();
  }
  if(p.combo>=2){
    var crank=null;
    for(var cri=COMBO_RANKS.length-1;cri>=0;cri--) if(p.combo>=COMBO_RANKS[cri].n){ crank=COMBO_RANKS[cri]; break; }
    var ccol = crank? crank.c : '#8fdcff';
    var csize = p.combo>=8? 34 : p.combo>=5? 30 : 26;    ctx.save();
    ctx.font='800 '+csize+'px "Segoe UI",sans-serif';
    ctx.lineWidth=5; ctx.strokeStyle='rgba(16,10,26,.9)';
    ctx.strokeText('x'+p.combo, 30+barW+34, 54);
    ctx.fillStyle=ccol;
    ctx.fillText('x'+p.combo, 30+barW+34, 54);
    var cw=54, cf=clamp(p.comboT/1.3,0,1);
    ctx.fillStyle='rgba(16,10,26,.7)';
    ctx.fillRect(30+barW+34, 60, cw, 4);
    ctx.fillStyle=ccol;
    ctx.fillRect(30+barW+34, 60, cw*cf, 4);
    ctx.restore();
  }

  // враг
  ctx.textAlign='right';
  ctx.fillStyle='rgba(10,6,18,.55)';
  rr(W-46-barW-16,26,barW+16,72,18); ctx.fill();
  drawHealthBar(W-46-barW,34,barW,barH, e.hp/e.maxHp, '#a8e6ff','#5cc3e8', true);
  drawHealthBar(W-46-barW*0.8,66,barW*0.8,12, e.rage/RAGE_MAX, '#8a3df0','#ffb3b3', true);
  ctx.font='700 17px "Segoe UI",sans-serif';
  ctx.fillStyle='#c8d0e4'; ctx.fillText('❤ '+Math.ceil(e.hp)+'  '+e.name, W-38, 22);
  if(e.combo>=2){
    ctx.font='800 24px "Segoe UI",sans-serif';
    ctx.fillStyle='#ffb3b3';
    ctx.textAlign='right';
    ctx.fillText('x'+e.combo, W-46-barW-34, 52);
  }

  // центр: прогресс лестницы и таймер
  ctx.textAlign='center';
  var cx=W/2;
  ctx.fillStyle='rgba(10,6,18,.55)'; rr(cx-92,22,184,62,18); ctx.fill();
  ctx.font='800 30px "Segoe UI",sans-serif';
  ctx.fillStyle= G.timeLeft<10 && G.roundState==='fight' ? '#ff9a9a' : '#ffffff';
  ctx.fillText(Math.ceil(G.timeLeft), cx, 56);
  // точки-противники: побеждённые золотые, текущий мигает, будущие серые
  var n=OPPONENTS.length, totalW=n*16, startX=cx-totalW/2+8;
  for(var i=0;i<n;i++){
    var px2=startX+i*16;
    ctx.beginPath(); ctx.arc(px2,78,6,0,6.2832);
    if(i<G.wins) ctx.fillStyle='#ffd98a';
    else if(i===G.fight) ctx.fillStyle= (Math.sin(G.t*7)>0?'#ffffff':'#8f8aa0');
    else ctx.fillStyle='rgba(255,255,255,.20)';
    ctx.fill();
  }
  // жизни сердечками
  var lx=cx-totalW/2-58;
  ctx.font='700 15px "Segoe UI",sans-serif';
  ctx.textAlign='left';
  for(var li=0;li<LIVES;li++){
    ctx.fillStyle= li<G.lives? '#ff5c7a':'rgba(255,255,255,.20)';
    ctx.fillText('♥', lx+li*17, 84);
  }
  ctx.textAlign='center';
  ctx.font='600 13px "Segoe UI",sans-serif';
  ctx.fillStyle='#bfb3d6';
  ctx.fillText('Бой '+(G.fight+1)+'/'+n+' · '+OPPONENTS[G.fight].name+' «'+OPPONENTS[G.fight].title+'»', cx, 102);

  // подсказка снизу
  ctx.font='600 14px "Segoe UI",sans-serif';
  ctx.fillStyle='rgba(255,255,255,.5)';
  ctx.fillText('A D — идти · W — прыжок ×2 · ПРОБЕЛ — удар (комбо/выпад/воздух) · U — сверхудар', cx, H-16);

  // отсчёт
  if(G.roundState==='countdown'){
    var n=Math.ceil(G.countdown);
    var frac=1-(G.countdown-Math.floor(G.countdown));
    ctx.save();
    ctx.globalAlpha=clamp(1-frac*0.7,0,1);
    ctx.font='800 '+(110+frac*40)+'px "Segoe UI",sans-serif';
    ctx.fillStyle= n>0? '#ffe08a':'#8fff9a';
    ctx.textAlign='center';
    ctx.fillText(n>0? String(n):'БОЙ!', cx, H/2+20);
    ctx.restore();
  }
}
function drawFeathers(dt){
  for(var i=0;i<G.feathers.length;i++){
    var f=G.feathers[i];
    f.vy+=520*dt;
    f.vx*=0.985;
    f.x+=f.vx*dt; f.y+=f.vy*dt;
    f.rot+=f.vr*dt;
    f.life-=dt;
    if(f.y>FLOOR+10){ f.y=FLOOR+10; f.vy*=-0.28; f.vx*=0.6; f.vr*=0.7; }
    var a=clamp(f.life/f.max,0,1);
    ctx.save();
    ctx.globalAlpha=a;
    ctx.translate(f.x,f.y); ctx.rotate(f.rot);
    ctx.fillStyle=f.col;
    ctx.beginPath();
    ctx.moveTo(0,0);
    ctx.quadraticCurveTo(f.s*0.8,-f.s*0.5, f.s*1.5,0);
    ctx.quadraticCurveTo(f.s*0.8, f.s*0.5, 0,0);
    ctx.fill();
    ctx.strokeStyle='rgba(180,170,210,.5)'; ctx.lineWidth=0.7;
    ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(f.s*1.4,0); ctx.stroke();
    ctx.restore();
  }
  G.feathers=G.feathers.filter(function(f){ return f.life>0; });
}
function drawPuffs(dt){
  for(var i=0;i<G.puffs.length;i++){
    var p=G.puffs[i];
    p.life-=dt;
    var t=1-p.life/p.maxLife;
    var r=lerp(p.r,p.max,ease(clamp(t,0,1)));
    ctx.save();
    ctx.globalAlpha=clamp(p.life/p.maxLife*0.55,0,1);
    var g=ctx.createRadialGradient(p.x,p.y,r*0.2,p.x,p.y,r);
    g.addColorStop(0,'rgba(255,255,255,.85)');
    g.addColorStop(1,'rgba(255,255,255,0)');
    ctx.fillStyle=g;
    ctx.beginPath(); ctx.arc(p.x,p.y,r,0,6.2832); ctx.fill();
    ctx.restore();
  }
  G.puffs=G.puffs.filter(function(p){ return p.life>0; });
}
function drawFloats(dt){
  ctx.textAlign='center'; ctx.textBaseline='middle';
  for(var i=0;i<G.floats.length;i++){
    var f=G.floats[i];
    f.y+=f.vy*dt; f.vy*=0.94; f.t-=dt;
    var a=clamp(f.t/f.life,0,1);
    ctx.save();
    ctx.globalAlpha=a;
    ctx.font='800 '+f.size+'px "Segoe UI",sans-serif';
    ctx.lineWidth=5; ctx.strokeStyle='rgba(20,12,30,.85)';
    ctx.strokeText(f.text,f.x,f.y);
    ctx.fillStyle=f.col;
    ctx.fillText(f.text,f.x,f.y);
    ctx.restore();
  }
  G.floats=G.floats.filter(function(f){ return f.t>0; });
  ctx.textBaseline='alphabetic';
}

/* ============================================================
   ГЛАВНЫЙ ЦИКЛ
   ============================================================ */
function update(dt){
  G.t+=dt;
  if(G.shake>0) G.shake=Math.max(0,G.shake-dt*38);
  if(G.comboFlash>0) G.comboFlash=Math.max(0,G.comboFlash-dt);
  if(G.punch>0) G.punch=Math.max(0,G.punch-dt*G.punchDecay);

  if(G.scene!=='fight') return;

  if(G.hitstop>0){ G.hitstop-=dt; dt*=0.15; }
  // замедление при нокауте
  if(G.slowmo>0){ G.slowmo-=dt; dt*=0.35; }
  // землетрясение от супера «Каменной» подушки
  if(G.quakeT>0){
    G.quakeT-=dt;
    if(G.quakeT<=0){
      // удар по полу — тряска и пыль
      G.shake=Math.max(G.shake,30); G.punch=1.0;
      addDust(480,FLOOR,26);
      for(var qi=0;qi<3;qi++)
        G.shockwaves.push({x:480,y:FLOOR-10,r:20,max:520+qi*80,life:0.5,maxLife:0.5,col:'#c4becf'});
      SFX.spike();
    }
  }
  // лучи живут своим временем
  for(var bi=G.beams.length-1;bi>=0;bi--){
    G.beams[bi].life-=dt;
    if(G.beams[bi].life<=0) G.beams.splice(bi,1);
  }

  updateRound(dt);

  var active=(G.roundState==='fight'||G.roundState==='ko');
  if(active){
    updateAI(dt);
    updateCat(G.player,dt);
    updateCat(G.enemy,dt);
  }
}
function render(dt){
  var k=G.scale*(G.dpr||1);
  ctx.setTransform(k,0,0,k,0,0);
  ctx.clearRect(0,0,W,H);

  ctx.save();
  // толчок камеры: короткий зум на сильных ударах
  if(G.punch>0.001){
    var z=1+G.punch*0.045;
    ctx.translate(W/2,H/2); ctx.scale(z,z); ctx.translate(-W/2,-H/2);
  }
  if(G.shake>0){
    ctx.translate(rnd(-G.shake,G.shake)*0.5, rnd(-G.shake,G.shake)*0.35);
  }
  drawBackground();

  if(G.player && G.enemy){
    // дальний кот первым
    var order = G.player.y<=G.enemy.y ? [G.player,G.enemy] : [G.enemy,G.player];
    for(var i=0;i<order.length;i++){ drawStatusFx(order[i]); drawSpeedLines(order[i]); drawCat(order[i]); }
  }

  drawShockwaves(dt);
  drawHitMarks(dt);
  drawBeams(dt);
  drawFeathers(dt);
  drawDust(dt);
  drawPuffs(dt);
  drawFloats(dt);
  ctx.restore();
  drawComboFlash();

  if(G.player && G.enemy) drawHud();
}

var last=0;
function loop(ts){
  if(!last) last=ts;
  var dt=(ts-last)/1000; last=ts;
  if(dt>0.05) dt=0.05;
  update(dt);
  render(dt);
  requestAnimationFrame(loop);
}

/* ============================================================
   РАЗМЕР И МАСШТАБ
   ============================================================ */
var G_scale=1;
function resize(){
  var availW=window.innerWidth-24, availH=window.innerHeight-24;
  var s=Math.min(availW/W, availH/H);
  s=Math.max(0.35,s);
  G.scale=s;
  stage.style.width=(W*s)+'px';
  stage.style.height=(H*s)+'px';
  var dpr=Math.min(window.devicePixelRatio||1, 2);
  G.dpr=dpr;
  cvs.width=Math.round(W*s*dpr);
  cvs.height=Math.round(H*s*dpr);
  ui.style.transform='scale('+s+')';
}
window.addEventListener('resize',resize);

/* ============================================================
   ВВОД
   ============================================================ */
function keyId(e){
  if(e.code){
    if(e.code==='Space') return 'space';
    if(e.code==='Escape') return 'escape';
    if(e.code==='ShiftLeft'||e.code==='ShiftRight') return 'shift';
    if(e.code==='ArrowUp') return 'arrowup';
    if(e.code==='ArrowDown') return 'arrowdown';
    if(e.code==='ArrowLeft') return 'arrowleft';
    if(e.code==='ArrowRight') return 'arrowright';
    if(e.code.indexOf('Key')===0) return e.code.slice(3).toLowerCase();
  }
  var k=(e.key||'').toLowerCase();
  if(k===' ') k='space';
  if(k==='shift') k='shift';
  return k;
}
document.addEventListener('keydown',function(e){
  var k=keyId(e);
  if(k==='escape'){
    e.preventDefault();
    if(G.scene==='fight'){ showPause(); }
    else if(G.scene==='pause'){ closeModal(); G.scene='fight'; }
    return;
  }
  if(k===' '||k==='space') e.preventDefault();
  if(['arrowup','arrowdown','arrowleft','arrowright'].indexOf(k)>=0) e.preventDefault();
  keys[k]=true;
  if(G.scene!=='fight') return;
  if(k==='w'||k==='arrowup'){ if(!e.repeat) playerJump(); return; }
  if(k==='j'||k==='space'||k==='k'||k==='f'||k==='l'){ if(!e.repeat) playerAttack(); return; }
  if(k==='u'||k==='shift'||k==='q'||k==='e'){ if(!e.repeat) useSuper(); return; }
},false);
document.addEventListener('keyup',function(e){ keys[keyId(e)]=false; },false);
window.addEventListener('blur',function(){ keys={}; });

/* ---------- тач ---------- */
function initTouch(){
  if(!('ontouchstart' in window) && !navigator.maxTouchPoints) return;
  function mk(label,x,y,w,h,type,fn){
    var el=document.createElement('div');
    el.className='tbtn'+(w>70?' wide':'');
    el.textContent=label;
    el.style.left=x+'px'; el.style.top=y+'px';
    el.style.width=w+'px'; el.style.height=h+'px';
    var onDown=function(ev){ ev.preventDefault(); actx(); fn(true); };
    var onUp=function(ev){ if(ev) ev.preventDefault(); fn(false); };
    el.addEventListener('pointerdown',onDown,{passive:false});
    el.addEventListener('pointerup',onUp,{passive:false});
    el.addEventListener('pointercancel',onUp,{passive:false});
    el.addEventListener('pointerleave',function(){ fn(false); });
    ui.appendChild(el);
    return el;
  }
  mk('◀',24,452,62,62,'',function(d){ touchSet('left',d); });
  mk('▶',96,452,62,62,'',function(d){ touchSet('right',d); });
  mk('▲',60,378,62,62,'',function(d){ if(d) playerJump(); });
  mk('УДАР',640,452,150,62,'',function(d){ if(d) playerAttack(); });
  mk('СВЕРХ',810,452,126,62,'',function(d){ if(d) useSuper(); });
  mk('БЛОК',0,0,0,0,'',function(){}).style.display='none';
  function touchSet(k,d){ keys[k==='left'?'a':'d']=d; }
}

/* ============================================================
   СТАРТ
   ============================================================ */
resetMods();
resize();
initTouch();
showMenu();
requestAnimationFrame(loop);

// отладочный доступ — только при #debug
if(location.hash==='#debug'){
  window.__B={G:G, COMBO:COMBO, AIR_ATK:AIR_ATK, AIR_UP:AIR_UP, LUNGE:LUNGE, SWIPE:SWIPE,
    SUPER:SUPER, SUPER_DEFS:SUPER_DEFS, ARENAS:ARENAS, BONUSES:BONUSES, COMBO_RANKS:COMBO_RANKS,
    OPPONENTS:OPPONENTS, PILLOWS:PILLOWS, LIVES:LIVES,
    makeCat:makeCat, newGame:newGame, startFight:startFight, startAttack:startAttack,
    playerAttack:playerAttack, playerJump:playerJump, useSuper:useSuper, gainRage:gainRage,
    superLabel:superLabel, pillow:pillow, update:update, render:render, updateAI:updateAI,
    updateCat:updateCat, updateRound:updateRound, applyBonus:applyBonus, koCat:koCat,
    dealDamage:dealDamage, resize:resize, drawBackground:drawBackground, drawCat:drawCat,
    setKeys:function(o){ keys=o; }, showMenu:showMenu, showWinScreen:showWinScreen,
    setPillow:function(id){ G.pillow=id; if(G.unlocked.indexOf(id)<0) G.unlocked.push(id); },
    get keys(){return keys;}};
}

})();
